# PHOENIX MATRIX SOVEREIGN ARCHITECTURE
# [STATUS]: 18-Repository Substrate Consolidated
# [FUTURE ENHANCEMENT]: Needs continuous formal verification scaling and HDF5 vector optimizations.
# [POTENTIAL LOOPHOLE]: Ensure strict hardware isolation when deploying to bare-metal. Watch for timing side-channels.
# [ERROR PRONE AREA]: Concurrency bottlenecks in event bus and race conditions in cross-domain memory mappings.
# PhoenixCore — Event Bus Contract
# Canonical definition of all event bus topics, priorities, routing, and retention.
# ALL repos depend on PhoenixCore contracts. NO other repo may export cross-boundary types.

version: "1.0.0"
contract: event-bus
schema_version: "v1"

topics:
  - name: phoenix.events.critical
    priority: 0
    description: >
      System-critical events requiring immediate processing. Includes kill switch
      activations, security breaches, consensus failures, and integrity violations.
      MUST be processed within 100ms. Never throttled. Never dropped.
    retention:
      duration: "forever"
      compaction: false
    dead_letter:
      enabled: true
      topic: phoenix.events.critical.dlq
      max_retries: 10
      retry_backoff: "exponential"
      alert_on_dlq: true
    guarantees:
      delivery: "exactly-once"
      ordering: "strict-causal"
      durability: "synchronous-replicated"

  - name: phoenix.events.high
    priority: 1
    description: >
      High-priority events for state transitions, enforcement actions,
      and advisory notifications. MUST be processed within 500ms.
    retention:
      duration: "90d"
      compaction: true
      compaction_key: "event_id"
    dead_letter:
      enabled: true
      topic: phoenix.events.high.dlq
      max_retries: 5
      retry_backoff: "exponential"
      alert_on_dlq: true
    guarantees:
      delivery: "at-least-once"
      ordering: "partition-ordered"
      durability: "synchronous-replicated"

  - name: phoenix.events.normal
    priority: 2
    description: >
      Normal-priority events for telemetry, trace updates, memory operations,
      and routine state reporting. Processed in order, best-effort latency.
    retention:
      duration: "30d"
      compaction: true
      compaction_key: "event_id"
    dead_letter:
      enabled: true
      topic: phoenix.events.normal.dlq
      max_retries: 3
      retry_backoff: "linear"
      alert_on_dlq: false
    guarantees:
      delivery: "at-least-once"
      ordering: "partition-ordered"
      durability: "asynchronous-replicated"

  - name: phoenix.events.background
    priority: 3
    description: >
      Background events for analytics, batch processing, simulation results,
      and non-urgent reporting. May be delayed or batched.
    retention:
      duration: "7d"
      compaction: true
      compaction_key: "event_type"
    dead_letter:
      enabled: false
    guarantees:
      delivery: "at-most-once"
      ordering: "best-effort"
      durability: "asynchronous-replicated"

priority_classes:
  - class: CRITICAL
    priority: 0
    preempts: [HIGH, NORMAL, BACKGROUND]
    throttle: never
    drop: never
    timeout_ms: 100

  - class: HIGH
    priority: 1
    preempts: [NORMAL, BACKGROUND]
    throttle: adaptive
    drop: never
    timeout_ms: 500

  - class: NORMAL
    priority: 2
    preempts: [BACKGROUND]
    throttle: adaptive
    drop: on_backpressure
    timeout_ms: 5000

  - class: BACKGROUND
    priority: 3
    preempts: []
    throttle: aggressive
    drop: on_backpressure
    timeout_ms: 30000

routing_rules:
  - rule: event_type_routing
    description: Route events based on fully-qualified event type
    match: "event_type"
    routes:
      - pattern: "phoenix.guard.*"
        topic: phoenix.events.critical
      - pattern: "phoenix.warden.*"
        topic: phoenix.events.critical
      - pattern: "phoenix.enforcement.*"
        topic: phoenix.events.high
      - pattern: "phoenix.advisory.*"
        topic: phoenix.events.high
      - pattern: "phoenix.ledger.*"
        topic: phoenix.events.high
      - pattern: "phoenix.trace.*"
        topic: phoenix.events.normal
      - pattern: "phoenix.truth.*"
        topic: phoenix.events.normal
      - pattern: "phoenix.memory.*"
        topic: phoenix.events.normal
      - pattern: "phoenix.simulation.*"
        topic: phoenix.events.background
      - pattern: "phoenix.validation.*"
        topic: phoenix.events.normal

  - rule: trust_score_escalation
    description: Escalate events with low trust scores to higher priority
    condition: "trust_score < 0.3"
    action: promote_one_level

  - rule: replay_routing
    description: Replay events always route to their original topic
    condition: "replay_sequence > 0"
    action: preserve_original_topic

replay_rules:
  ordering: strict_monotonic
  description: >
    All replayed events MUST maintain their original monotonic ordering.
    Replay MUST be deterministic — same inputs produce same outputs.
  deduplication:
    enabled: true
    key: "event_id"
    window: "24h"
  checkpoint:
    enabled: true
    interval: 1000
    storage: ledger

dead_letter_rules:
  global:
    max_age: "7d"
    alert_threshold: 100
    auto_retry: false
    manual_review_required: true
  per_topic_overrides:
    phoenix.events.critical.dlq:
      max_age: "forever"
      alert_threshold: 1
      auto_retry: true
      manual_review_required: true

retention_rules:
  global_minimum: "7d"
  audit_trail: "forever"
  description: >
    Critical events and audit trail entries are retained forever.
    Other events follow per-topic retention policies.
    Compacted topics retain the latest value per key.

invariants:
  - "Events MUST be wrapped in EventEnvelope from proto/v1/event.proto"
  - "Event ordering MUST be preserved within a partition"
  - "Critical events MUST NEVER be dropped"
  - "Replay MUST produce identical state transitions"
  - "Dead-letter events MUST be reviewed before deletion"
  - "All events MUST include validation_hash"
