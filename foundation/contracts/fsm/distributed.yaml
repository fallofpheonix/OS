# PHOENIX MATRIX SOVEREIGN ARCHITECTURE
# [STATUS]: 18-Repository Substrate Consolidated
# [FUTURE ENHANCEMENT]: Needs continuous formal verification scaling and HDF5 vector optimizations.
# [POTENTIAL LOOPHOLE]: Ensure strict hardware isolation when deploying to bare-metal. Watch for timing side-channels.
# [ERROR PRONE AREA]: Concurrency bottlenecks in event bus and race conditions in cross-domain memory mappings.
# PhoenixCore — Distributed FSM Contract
# Canonical Finite State Machine definition for the Distributed Coordination layer.
# Manages node membership, consensus, replication, and partition recovery.
# ALL repos depend on PhoenixCore contracts. NO other repo may export cross-boundary types.

version: "1.0.0"
contract: fsm/distributed
schema_version: "v1"
layer: "Phoenix Matrix — Distributed Coordination Layer"

states:
  - name: JOINING
    description: >
      A new node is joining the cluster. Identity verification, certificate
      issuance, and state synchronization are in progress.
    initial: true
    terminal: false

  - name: SYNCING
    description: >
      The node is synchronizing its ledger and state with the cluster.
      It cannot participate in consensus until sync is complete.
    initial: false
    terminal: false

  - name: FOLLOWER
    description: >
      The node is a follower in the consensus protocol. It replicates
      ledger entries from the leader and participates in quorum votes.
    initial: false
    terminal: false

  - name: CANDIDATE
    description: >
      The node is a candidate for leader election. It has initiated
      a vote and is waiting for quorum acceptance.
    initial: false
    terminal: false

  - name: LEADER
    description: >
      The node is the consensus leader. It accepts writes, manages
      replication to followers, and creates checkpoints.
    initial: false
    terminal: false

  - name: PARTITIONED
    description: >
      The node has been network-partitioned from the cluster.
      It operates in read-only mode and queues writes for reconciliation.
    initial: false
    terminal: false

  - name: RECOVERING
    description: >
      The node is recovering from a partition or failure. It is
      reconciling divergent state and re-synchronizing with the cluster.
    initial: false
    terminal: false

  - name: DEPARTED
    description: >
      The node has been gracefully removed from the cluster.
      Its authority certificate has been revoked.
    initial: false
    terminal: true

transitions:
  - from: JOINING
    to: SYNCING
    trigger: identity_verified
    guard: "authority_certificate.valid AND public_key.verified"
    evidence_required: true
    description: "Node identity verified, begin state sync"

  - from: SYNCING
    to: FOLLOWER
    trigger: sync_complete
    guard: "ledger_synced AND state_hash_matches AND lag < max_lag"
    evidence_required: true
    description: "State synchronization complete, join as follower"

  - from: FOLLOWER
    to: CANDIDATE
    trigger: election_timeout
    guard: "leader_heartbeat_missing > election_timeout AND term_valid"
    evidence_required: true
    description: "Leader heartbeat lost, initiate election"

  - from: CANDIDATE
    to: LEADER
    trigger: election_won
    guard: "votes_received >= quorum_threshold AND term == current_term"
    evidence_required: true
    description: "Received quorum votes, become leader"

  - from: CANDIDATE
    to: FOLLOWER
    trigger: election_lost
    guard: "higher_term_observed OR timeout_expired"
    evidence_required: true
    description: "Election lost — revert to follower"

  - from: LEADER
    to: FOLLOWER
    trigger: higher_term_leader
    guard: "observed_term > current_term AND legitimate_leader"
    evidence_required: true
    description: "Higher-term leader detected, step down"

  - from: FOLLOWER
    to: PARTITIONED
    trigger: network_partition
    guard: "cluster_unreachable_duration > partition_threshold"
    evidence_required: true
    description: "Network partition detected"

  - from: LEADER
    to: PARTITIONED
    trigger: quorum_lost
    guard: "reachable_nodes < quorum_threshold"
    evidence_required: true
    description: "Lost quorum due to partition"

  - from: PARTITIONED
    to: RECOVERING
    trigger: connectivity_restored
    guard: "cluster_reachable AND divergence_detected"
    evidence_required: true
    description: "Network restored but state has diverged"

  - from: RECOVERING
    to: FOLLOWER
    trigger: recovery_complete
    guard: "state_reconciled AND ledger_consistent AND lag < max_lag"
    evidence_required: true
    description: "Recovery complete, rejoin as follower"

  - from: RECOVERING
    to: SYNCING
    trigger: recovery_failed
    guard: "state_irreconcilable AND full_resync_required"
    evidence_required: true
    description: "Recovery failed, full resync required"

  - from: FOLLOWER
    to: DEPARTED
    trigger: graceful_departure
    guard: "departure_announced AND handoff_complete AND certificate_revoked"
    evidence_required: true
    description: "Graceful departure from cluster"

  - from: LEADER
    to: DEPARTED
    trigger: leader_departure
    guard: "successor_elected AND handoff_complete AND certificate_revoked"
    evidence_required: true
    description: "Leader gracefully departs after successor elected"

rollback_paths:
  - from: CANDIDATE
    to: FOLLOWER
    trigger: election_cancelled
    guard: "pre_existing_leader_found"
    description: "Cancel election if valid leader found"

  - from: PARTITIONED
    to: FOLLOWER
    trigger: partition_healed_clean
    guard: "no_divergence AND state_consistent"
    description: "Partition healed with no state divergence"

forbidden_transitions:
  - from: JOINING
    to: LEADER
    reason: "Cannot become leader without syncing and following first"

  - from: JOINING
    to: CANDIDATE
    reason: "Cannot run for election before sync is complete"

  - from: SYNCING
    to: LEADER
    reason: "Cannot lead without first being a follower"

  - from: SYNCING
    to: CANDIDATE
    reason: "Cannot run for election before sync is complete"

  - from: PARTITIONED
    to: LEADER
    reason: "Cannot lead while partitioned"

  - from: PARTITIONED
    to: CANDIDATE
    reason: "Cannot run for election while partitioned"

  - from: DEPARTED
    to: any
    reason: "DEPARTED is terminal — node must rejoin as new"

invariants:
  - "Every transition MUST produce a LedgerEntry"
  - "Every transition MUST be evidence-backed"
  - "LEADER MUST have quorum at all times"
  - "PARTITIONED nodes MUST be read-only"
  - "DEPARTED is terminal — nodes must rejoin as new"
  - "State reconciliation MUST be deterministic"
  - "Authority certificates MUST be revoked on departure"
