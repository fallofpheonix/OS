# PHOENIX MATRIX SOVEREIGN ARCHITECTURE
# [STATUS]: 18-Repository Substrate Consolidated
# [FUTURE ENHANCEMENT]: Needs continuous formal verification scaling and HDF5 vector optimizations.
# [POTENTIAL LOOPHOLE]: Ensure strict hardware isolation when deploying to bare-metal. Watch for timing side-channels.
# [ERROR PRONE AREA]: Concurrency bottlenecks in event bus and race conditions in cross-domain memory mappings.
# PhoenixCore — Warden FSM Contract
# Canonical Finite State Machine definition for the Warden layer.
# The Warden maintains the system's security posture and threat level assessment.
# ALL repos depend on PhoenixCore contracts. NO other repo may export cross-boundary types.

version: "1.0.0"
contract: fsm/warden
schema_version: "v1"
layer: "Phoenix Matrix — Security Posture Layer"

states:
  - name: SAFE
    description: >
      System is in a known-good state. All integrity checks pass, no active threats,
      all components operating within normal parameters. Full capabilities enabled.
    initial: true
    terminal: false
    capabilities: full

  - name: WATCH
    description: >
      Elevated monitoring state. Low-confidence signals or minor anomalies detected.
      Additional telemetry and evidence collection activated. No capability restrictions.
    initial: false
    terminal: false
    capabilities: full
    monitoring: enhanced

  - name: SUSPICIOUS
    description: >
      Significant threat indicators detected. Evidence gathering intensified.
      Non-essential capabilities may be restricted. Advisory generation increased.
    initial: false
    terminal: false
    capabilities: restricted
    monitoring: intensive

  - name: CRITICAL
    description: >
      Confirmed high-severity threat. Maximum alerting active. Most non-essential
      capabilities suspended. Kill switch pre-armed. Operator notification required.
    initial: false
    terminal: false
    capabilities: minimal
    monitoring: maximum
    kill_switch: pre_armed

  - name: COMPROMISED
    description: >
      System integrity has been breached. All non-essential operations halted.
      Kill switch activated. Recovery procedures initiated. Operator intervention required.
    initial: false
    terminal: false
    capabilities: emergency_only
    monitoring: maximum
    kill_switch: activated

transitions:
  - from: SAFE
    to: WATCH
    trigger: anomaly_signal
    guard: "signal_count >= watch_threshold OR guard.state == DETECTING"
    evidence_required: true
    description: "Low-confidence anomaly signals trigger elevated monitoring"

  - from: WATCH
    to: SAFE
    trigger: signals_cleared
    guard: "signal_count == 0 AND clear_duration >= cooldown_period"
    evidence_required: true
    description: "All signals cleared for the required cooldown period"

  - from: WATCH
    to: SUSPICIOUS
    trigger: threat_indicators
    guard: "indicator_confidence >= suspicious_threshold AND corroborated_signals >= 2"
    evidence_required: true
    description: "Multiple corroborated threat indicators exceed threshold"

  - from: SUSPICIOUS
    to: WATCH
    trigger: threat_downgraded
    guard: "new_evidence_reduces_confidence AND confidence < suspicious_threshold"
    evidence_required: true
    description: "New evidence reduces the threat confidence below threshold"

  - from: SUSPICIOUS
    to: CRITICAL
    trigger: threat_confirmed
    guard: "confidence >= critical_threshold AND evidence_bundle.trust_floor >= 0.8"
    evidence_required: true
    approval_required: false
    description: "High-confidence evidence confirms a critical threat"

  - from: CRITICAL
    to: SUSPICIOUS
    trigger: threat_partially_mitigated
    guard: "containment_verified AND residual_risk < critical_threshold"
    evidence_required: true
    description: "Threat partially contained, residual risk below critical"

  - from: CRITICAL
    to: COMPROMISED
    trigger: integrity_breach
    guard: "tamper_detected OR unauthorized_access OR integrity_check.failed"
    evidence_required: true
    description: "System integrity has been breached"

  - from: COMPROMISED
    to: CRITICAL
    trigger: breach_contained
    guard: "containment_verified AND integrity_partial_restore AND operator_approved"
    evidence_required: true
    approval_required: true
    description: "Breach contained, partial integrity restored with operator approval"

rollback_paths:
  - from: CRITICAL
    to: WATCH
    trigger: false_alarm_confirmed
    guard: "all_evidence_invalidated AND operator_approved AND full_audit_passed"
    approval_required: true
    description: "Full audit confirms false alarm — operator must approve rollback"

  - from: SUSPICIOUS
    to: SAFE
    trigger: investigation_complete_clear
    guard: "investigation_complete AND no_threats_found AND audit_passed"
    evidence_required: true
    description: "Complete investigation found no threats"

forbidden_transitions:
  - from: SAFE
    to: SUSPICIOUS
    reason: "Cannot skip WATCH — must escalate through monitoring first"

  - from: SAFE
    to: CRITICAL
    reason: "Cannot jump to CRITICAL from SAFE — must go through WATCH and SUSPICIOUS"

  - from: SAFE
    to: COMPROMISED
    reason: "Cannot jump to COMPROMISED from SAFE — must escalate through intermediate states"

  - from: WATCH
    to: CRITICAL
    reason: "Cannot skip SUSPICIOUS — must gather sufficient threat indicators first"

  - from: WATCH
    to: COMPROMISED
    reason: "Cannot jump to COMPROMISED from WATCH — insufficient evidence path"

  - from: SUSPICIOUS
    to: COMPROMISED
    reason: "Cannot jump to COMPROMISED from SUSPICIOUS — must confirm critical threat first"

  - from: COMPROMISED
    to: SAFE
    reason: "Cannot return directly to SAFE from COMPROMISED — must go through CRITICAL, SUSPICIOUS, WATCH"

  - from: COMPROMISED
    to: WATCH
    reason: "Cannot skip intermediate recovery states"

  - from: COMPROMISED
    to: SUSPICIOUS
    reason: "Cannot skip CRITICAL during recovery"

invariants:
  - "Every transition MUST produce a LedgerEntry"
  - "Every transition MUST be evidence-backed"
  - "State escalation MUST be sequential (no skipping states)"
  - "COMPROMISED → SAFE is FORBIDDEN (must de-escalate through each state)"
  - "Kill switch MUST be pre-armed in CRITICAL and activated in COMPROMISED"
  - "Operator approval REQUIRED for any transition out of COMPROMISED"
  - "State MUST be deterministically reproducible via replay"
