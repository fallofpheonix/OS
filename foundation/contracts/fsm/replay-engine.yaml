# PHOENIX MATRIX SOVEREIGN ARCHITECTURE
# [STATUS]: 18-Repository Substrate Consolidated
# [FUTURE ENHANCEMENT]: Needs continuous formal verification scaling and HDF5 vector optimizations.
# [POTENTIAL LOOPHOLE]: Ensure strict hardware isolation when deploying to bare-metal. Watch for timing side-channels.
# [ERROR PRONE AREA]: Concurrency bottlenecks in event bus and race conditions in cross-domain memory mappings.
# PhoenixCore — Replay Engine FSM Contract
# Canonical Finite State Machine definition for the Replay Engine.
# The Replay Engine provides deterministic replay of state transitions for
# verification, debugging, recovery, and chaos testing.
# ALL repos depend on PhoenixCore contracts. NO other repo may export cross-boundary types.

version: "1.0.0"
contract: fsm/replay-engine
schema_version: "v1"
layer: "Phoenix Matrix — Replay & Validation Layer"

states:
  - name: STANDBY
    description: >
      The Replay Engine is idle and ready to accept replay requests.
      No active replay session in progress.
    initial: true
    terminal: false

  - name: LOADING
    description: >
      A replay session has been requested. The engine is loading the checkpoint,
      scenario definition, input sequence, and invariant set.
    initial: false
    terminal: false

  - name: REPLAYING
    description: >
      Active deterministic replay in progress. Events are being replayed
      in strict monotonic order. State transitions are being verified
      against expected outcomes.
    initial: false
    terminal: false

  - name: VERIFYING
    description: >
      Replay execution is complete. The engine is verifying final state
      against expected state, checking invariants, and computing divergence.
    initial: false
    terminal: false

  - name: DIVERGED
    description: >
      Replay produced a state that diverges from the expected outcome.
      This indicates a non-determinism bug, contract violation, or data corruption.
      Requires investigation and remediation.
    initial: false
    terminal: false

  - name: COMPLETED
    description: >
      Replay completed successfully. All invariants passed, final state
      matches expected state. Results are recorded in the ledger.
    initial: false
    terminal: true

  - name: FAILED
    description: >
      Replay failed due to an infrastructure error (not a divergence).
      Errors include corrupt checkpoints, missing inputs, or engine crashes.
    initial: false
    terminal: false

transitions:
  - from: STANDBY
    to: LOADING
    trigger: replay_requested
    guard: "scenario.valid AND checkpoint.exists AND inputs.available"
    evidence_required: true
    description: "A valid replay request has been submitted"

  - from: LOADING
    to: REPLAYING
    trigger: loading_complete
    guard: "checkpoint_loaded AND scenario_parsed AND invariants_registered"
    evidence_required: true
    description: "All replay inputs loaded successfully"

  - from: LOADING
    to: FAILED
    trigger: loading_failed
    guard: "checkpoint_corrupt OR inputs_missing OR scenario_invalid"
    evidence_required: true
    description: "Failed to load replay prerequisites"

  - from: REPLAYING
    to: VERIFYING
    trigger: replay_complete
    guard: "all_events_replayed AND no_runtime_errors"
    evidence_required: true
    description: "All events replayed without runtime errors"

  - from: REPLAYING
    to: FAILED
    trigger: replay_crashed
    guard: "runtime_error OR timeout_exceeded"
    evidence_required: true
    description: "Replay engine encountered a runtime error or timeout"

  - from: VERIFYING
    to: COMPLETED
    trigger: verification_passed
    guard: "final_state == expected_state AND all_invariants_passed AND checksum_matches"
    evidence_required: true
    description: "Verification passed — replay is deterministic"

  - from: VERIFYING
    to: DIVERGED
    trigger: verification_failed
    guard: "final_state != expected_state OR invariant_violated OR checksum_mismatch"
    evidence_required: true
    description: "Verification detected divergence"

  - from: DIVERGED
    to: STANDBY
    trigger: divergence_recorded
    guard: "divergence_report.filed AND remediation_plan.created"
    evidence_required: true
    description: "Divergence recorded and remediation planned — return to standby"

  - from: FAILED
    to: STANDBY
    trigger: failure_recorded
    guard: "failure_report.filed"
    evidence_required: true
    description: "Failure recorded — return to standby"

  - from: FAILED
    to: LOADING
    trigger: retry_requested
    guard: "retry_count < max_retries AND failure_cause.transient"
    evidence_required: true
    description: "Retry replay after transient failure"

rollback_paths:
  - from: REPLAYING
    to: LOADING
    trigger: replay_reset
    guard: "checkpoint_restore_required"
    description: "Reset replay from checkpoint"

  - from: VERIFYING
    to: REPLAYING
    trigger: re_replay_requested
    guard: "verification_inconclusive AND additional_replay_authorized"
    description: "Re-replay with additional instrumentation"

forbidden_transitions:
  - from: STANDBY
    to: REPLAYING
    reason: "Cannot replay without loading checkpoint and scenario first"

  - from: STANDBY
    to: VERIFYING
    reason: "Cannot verify without replaying first"

  - from: STANDBY
    to: COMPLETED
    reason: "Cannot complete without full replay and verification cycle"

  - from: LOADING
    to: VERIFYING
    reason: "Cannot verify without replaying"

  - from: LOADING
    to: COMPLETED
    reason: "Cannot complete without replay and verification"

  - from: REPLAYING
    to: COMPLETED
    reason: "Cannot complete without verification"

  - from: COMPLETED
    to: any
    reason: "COMPLETED is terminal"

invariants:
  - "Every transition MUST produce a LedgerEntry"
  - "Replay MUST be deterministic — same inputs MUST produce same outputs"
  - "Replay sequence MUST be strictly monotonically increasing"
  - "COMPLETED is terminal — results are immutable"
  - "Divergence MUST be recorded with full evidence"
  - "Failed replays MUST NOT produce COMPLETED state"
  - "State MUST be deterministically reproducible via replay (meta-replay)"
