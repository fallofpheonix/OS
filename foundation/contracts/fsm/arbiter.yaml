# PHOENIX MATRIX SOVEREIGN ARCHITECTURE
# [STATUS]: 18-Repository Substrate Consolidated
# [FUTURE ENHANCEMENT]: Needs continuous formal verification scaling and HDF5 vector optimizations.
# [POTENTIAL LOOPHOLE]: Ensure strict hardware isolation when deploying to bare-metal. Watch for timing side-channels.
# [ERROR PRONE AREA]: Concurrency bottlenecks in event bus and race conditions in cross-domain memory mappings.
# PhoenixCore — Arbiter FSM Contract
# Canonical Finite State Machine definition for the Arbiter layer.
# The Arbiter resolves conflicts, adjudicates disputes, and enforces consensus.
# ALL repos depend on PhoenixCore contracts. NO other repo may export cross-boundary types.

version: "1.0.0"
contract: fsm/arbiter
schema_version: "v1"
layer: "Phoenix Matrix — Adjudication & Consensus Layer"

states:
  - name: AWAITING
    description: >
      The Arbiter is idle, waiting for a dispute, conflict, or consensus request.
      No active adjudication in progress.
    initial: true
    terminal: false

  - name: HEARING
    description: >
      A dispute has been filed. The Arbiter is collecting evidence from all parties,
      reviewing truth assessments, and building a complete picture.
    initial: false
    terminal: false

  - name: DELIBERATING
    description: >
      All evidence has been collected. The Arbiter is evaluating contradictions,
      computing confidence scores, and formulating a decision.
    initial: false
    terminal: false

  - name: RULING
    description: >
      The Arbiter has reached a decision. The ruling is being formalized,
      signed, and recorded in the ledger.
    initial: false
    terminal: false

  - name: ENFORCING
    description: >
      The ruling is being enforced. Enforcement actions are being executed
      according to the ExecutionPlan. Rollback plan is armed.
    initial: false
    terminal: false

  - name: CLOSED
    description: >
      The dispute is resolved and enforcement is complete. The case is
      archived in the ledger with full evidence chain.
    initial: false
    terminal: true

transitions:
  - from: AWAITING
    to: HEARING
    trigger: dispute_filed
    guard: "dispute.valid AND dispute.evidence_refs.length > 0"
    evidence_required: true
    description: "A valid dispute with evidence has been filed"

  - from: HEARING
    to: DELIBERATING
    trigger: evidence_complete
    guard: "all_parties_heard AND evidence_deadline_passed OR all_evidence_submitted"
    evidence_required: true
    description: "All evidence collected or deadline reached"

  - from: HEARING
    to: AWAITING
    trigger: dispute_withdrawn
    guard: "all_parties_agree_to_withdraw"
    evidence_required: true
    description: "All parties agree to withdraw the dispute"

  - from: DELIBERATING
    to: RULING
    trigger: decision_reached
    guard: "confidence >= ruling_threshold AND no_unresolved_contradictions"
    evidence_required: true
    description: "Arbiter has reached a decision with sufficient confidence"

  - from: DELIBERATING
    to: HEARING
    trigger: additional_evidence_needed
    guard: "confidence < ruling_threshold AND evidence_sources_available"
    evidence_required: true
    description: "More evidence needed before a ruling can be made"

  - from: RULING
    to: ENFORCING
    trigger: ruling_issued
    guard: "ruling.signed AND execution_plan.verified AND rollback_plan.verified"
    evidence_required: true
    description: "Ruling formalized with verified execution and rollback plans"

  - from: RULING
    to: DELIBERATING
    trigger: ruling_challenged
    guard: "new_contradicting_evidence AND challenge_within_window"
    evidence_required: true
    description: "New evidence challenges the ruling within the appeal window"

  - from: ENFORCING
    to: CLOSED
    trigger: enforcement_complete
    guard: "all_steps_executed AND verification_passed"
    evidence_required: true
    description: "All enforcement steps completed and verified"

  - from: ENFORCING
    to: RULING
    trigger: enforcement_failed
    guard: "execution_result.success == false AND rollback_executed"
    evidence_required: true
    description: "Enforcement failed — ruling needs revision after rollback"

rollback_paths:
  - from: ENFORCING
    to: RULING
    trigger: enforcement_rollback
    guard: "rollback_plan.executed AND state_restored"
    description: "Enforcement rolled back — return to ruling for revision"

  - from: RULING
    to: HEARING
    trigger: ruling_overturned
    guard: "operator_override AND full_evidence_review_required"
    approval_required: true
    description: "Operator overturns ruling — full rehearing required"

forbidden_transitions:
  - from: AWAITING
    to: DELIBERATING
    reason: "Cannot deliberate without first hearing evidence"

  - from: AWAITING
    to: RULING
    reason: "Cannot rule without hearing and deliberation"

  - from: AWAITING
    to: ENFORCING
    reason: "Cannot enforce without a ruling"

  - from: HEARING
    to: RULING
    reason: "Cannot rule without deliberation"

  - from: HEARING
    to: ENFORCING
    reason: "Cannot enforce without deliberation and ruling"

  - from: DELIBERATING
    to: ENFORCING
    reason: "Cannot enforce without a formal ruling"

  - from: CLOSED
    to: any
    reason: "CLOSED is terminal — disputes cannot be reopened (file a new dispute)"

invariants:
  - "Every transition MUST produce a LedgerEntry"
  - "Every transition MUST be evidence-backed"
  - "Rulings MUST be cryptographically signed"
  - "Enforcement MUST have a verified rollback plan"
  - "CLOSED is terminal — no transitions out"
  - "State MUST be deterministically reproducible via replay"
