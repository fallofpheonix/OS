# PHOENIX MATRIX SOVEREIGN ARCHITECTURE
# [STATUS]: 18-Repository Substrate Consolidated
# [FUTURE ENHANCEMENT]: Needs continuous formal verification scaling and HDF5 vector optimizations.
# [POTENTIAL LOOPHOLE]: Ensure strict hardware isolation when deploying to bare-metal. Watch for timing side-channels.
# [ERROR PRONE AREA]: Concurrency bottlenecks in event bus and race conditions in cross-domain memory mappings.
# PhoenixCore — Guard FSM Contract
# Canonical Finite State Machine definition for the Guard layer.
# The Guard is the first line of defense — it detects anomalies and initiates response.
# ALL repos depend on PhoenixCore contracts. NO other repo may export cross-boundary types.

version: "1.0.0"
contract: fsm/guard
schema_version: "v1"
layer: "Phoenix Matrix — Detection & Response Layer"

states:
  - name: IDLE
    description: >
      Normal operating state. The Guard is passively monitoring all event streams
      and telemetry for anomalies. No active threat detected.
    initial: true
    terminal: false

  - name: DETECTING
    description: >
      An anomaly has been detected. The Guard is gathering evidence, correlating
      signals, and computing confidence scores before deciding on a response.
    initial: false
    terminal: false

  - name: RESPONDING
    description: >
      The Guard has sufficient confidence to respond. It is emitting advisories,
      escalating to the Warden, or initiating containment procedures.
    initial: false
    terminal: false

  - name: ISOLATING
    description: >
      Active isolation of a compromised component or subsystem. Network partitions,
      process isolation, or capability revocation is in progress.
    initial: false
    terminal: false

  - name: RECOVERING
    description: >
      The threat has been contained. The Guard is verifying system integrity,
      replaying state from the last known-good checkpoint, and restoring normal operation.
    initial: false
    terminal: false

transitions:
  - from: IDLE
    to: DETECTING
    trigger: anomaly_detected
    guard: "evidence.trust_score < threshold OR telemetry.deviation > sigma_limit"
    evidence_required: true
    description: "An anomaly signal exceeds detection thresholds"

  - from: DETECTING
    to: IDLE
    trigger: anomaly_cleared
    guard: "confidence < false_positive_threshold AND evidence.contradictions == 0"
    evidence_required: true
    description: "Analysis determines the anomaly was benign"

  - from: DETECTING
    to: RESPONDING
    trigger: threat_confirmed
    guard: "confidence >= response_threshold AND evidence_bundle.trust_floor >= 0.7"
    evidence_required: true
    description: "Evidence confirms the threat with sufficient confidence"

  - from: RESPONDING
    to: ISOLATING
    trigger: isolation_required
    guard: "severity >= CRITICAL AND containment_plan.verified == true"
    evidence_required: true
    approval_required: false
    description: "Threat severity requires immediate isolation"

  - from: RESPONDING
    to: IDLE
    trigger: threat_mitigated
    guard: "all_advisories_resolved AND system_integrity_verified"
    evidence_required: true
    description: "Response actions successfully mitigated the threat"

  - from: ISOLATING
    to: RECOVERING
    trigger: isolation_complete
    guard: "isolated_components.all_contained AND no_lateral_movement"
    evidence_required: true
    description: "Isolation is complete and verified"

  - from: RECOVERING
    to: IDLE
    trigger: recovery_complete
    guard: "integrity_check.passed AND replay_verified AND state_consistent"
    evidence_required: true
    description: "Recovery is complete and system integrity is verified"

  - from: RECOVERING
    to: ISOLATING
    trigger: recovery_failed
    guard: "integrity_check.failed OR state_divergence_detected"
    evidence_required: true
    description: "Recovery failed — re-isolate and attempt alternative recovery"

rollback_paths:
  - from: RESPONDING
    to: DETECTING
    trigger: response_revoked
    guard: "new_evidence_contradicts_threat"
    description: "New evidence invalidates the threat assessment"

  - from: ISOLATING
    to: RESPONDING
    trigger: isolation_rollback
    guard: "false_positive_confirmed AND rollback_plan.verified"
    description: "Isolation was based on false positive — rollback"

  - from: RECOVERING
    to: RESPONDING
    trigger: recovery_reassess
    guard: "new_threat_detected_during_recovery"
    description: "New threat detected during recovery — reassess response"

forbidden_transitions:
  - from: IDLE
    to: ISOLATING
    reason: "Cannot isolate without first detecting and confirming a threat"

  - from: IDLE
    to: RECOVERING
    reason: "Cannot recover without a prior isolation event"

  - from: DETECTING
    to: ISOLATING
    reason: "Cannot isolate directly from detection — must go through response assessment"

  - from: DETECTING
    to: RECOVERING
    reason: "Cannot recover from detection state — no isolation has occurred"

  - from: ISOLATING
    to: IDLE
    reason: "Cannot return to IDLE from isolation — must go through recovery"

  - from: RESPONDING
    to: RECOVERING
    reason: "Cannot recover without isolation — must isolate first"

invariants:
  - "Every transition MUST produce a LedgerEntry"
  - "Every transition MUST be evidence-backed"
  - "ISOLATING → IDLE is FORBIDDEN (must go through RECOVERING)"
  - "State MUST be deterministically reproducible via replay"
  - "Guard MUST NOT execute enforcement — it only detects and advises"
