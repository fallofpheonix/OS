# PHOENIX MATRIX SOVEREIGN ARCHITECTURE
# [STATUS]: 18-Repository Substrate Consolidated
# [FUTURE ENHANCEMENT]: Needs continuous formal verification scaling and HDF5 vector optimizations.
# [POTENTIAL LOOPHOLE]: Ensure strict hardware isolation when deploying to bare-metal. Watch for timing side-channels.
# [ERROR PRONE AREA]: Concurrency bottlenecks in event bus and race conditions in cross-domain memory mappings.
# PhoenixCore — Ledger Contract
# Canonical definition of the append-only evidence ledger protocol.
# ALL repos depend on PhoenixCore contracts. NO other repo may export cross-boundary types.

version: "1.0.0"
contract: ledger
schema_version: "v1"

append_protocol:
  description: >
    The ledger is strictly append-only. Once an entry is written, it MUST NEVER
    be modified or deleted. Every append operation produces an EvidenceRecord
    and a LedgerEntry as defined in proto/v1/ledger.proto.
  rules:
    - "Entries MUST be appended in monotonically increasing replay_sequence order"
    - "Each entry MUST reference the hash of the previous entry (chain integrity)"
    - "Each entry MUST include a valid TransitionProof if recording a state change"
    - "Entries MUST be signed by the producing component"
    - "The ledger MUST reject entries with duplicate entry_id values"
    - "The ledger MUST reject entries with replay_sequence <= last committed sequence"
    - "The ledger MUST reject entries where evidence_hash does not match recomputed hash"
  fields_required:
    - entry_id
    - evidence_record
    - replay_sequence
    - signature
    - schema_version
    - created_at
    - validation_hash
  ordering: strict_monotonic
  idempotency: true
  guarantees:
    durability: "synchronous — entry is durable before acknowledgment"
    atomicity: "single-entry atomic append"
    consistency: "chain hash verified on every append"

checkpoint_protocol:
  description: >
    Periodic checkpoints capture a cumulative hash of all entries up to
    a given point. Checkpoints enable fast verification and recovery
    without replaying the entire ledger.
  rules:
    - "Checkpoints MUST be created every 1000 entries or every 1 hour, whichever comes first"
    - "Checkpoint cumulative_hash MUST be computed from all entries since the last checkpoint"
    - "Checkpoints MUST be signed by a quorum of validators (validator_quorum)"
    - "Checkpoint creation MUST be atomic with the last entry it covers"
    - "Checkpoints MUST be stored alongside the ledger with independent replication"
  interval:
    entries: 1000
    time: "1h"
  quorum:
    min_validators: 2
    algorithm: "majority"
  guarantees:
    integrity: "cumulative hash covers all entries since last checkpoint"
    availability: "checkpoints replicated to all nodes"

verification_protocol:
  description: >
    Verification ensures the integrity of the ledger by checking chain hashes,
    signatures, and transition proofs. Verification can be triggered on-demand,
    periodically, or during recovery.
  modes:
    - name: full_verification
      description: "Verify every entry from genesis to head"
      checks:
        - "Chain hash continuity"
        - "Signature validity"
        - "TransitionProof validity"
        - "Replay sequence monotonicity"
        - "Evidence hash recomputation"
      frequency: "weekly"
      
    - name: checkpoint_verification
      description: "Verify from last checkpoint to head"
      checks:
        - "Checkpoint cumulative_hash validity"
        - "Chain hash from checkpoint to head"
        - "Signature validity for new entries"
      frequency: "hourly"
      
    - name: tamper_detection
      description: "Detect any modification to existing entries"
      checks:
        - "Hash chain integrity"
        - "Entry immutability (content hash match)"
        - "Timestamp monotonicity"
      frequency: "continuous"
  output:
    type: VerificationResult
    proto: "proto/v1/ledger.proto"
  guarantees:
    detection: "Any single-bit modification MUST be detected"
    false_positive_rate: 0

recovery_protocol:
  description: >
    Recovery restores the ledger to a consistent state after a failure.
    Recovery uses checkpoints as starting points and replays entries
    from the checkpoint forward.
  steps:
    - step: 1
      action: "Locate the most recent valid checkpoint"
      verification: "Verify checkpoint cumulative_hash"
    - step: 2
      action: "Replay all entries from checkpoint to head"
      verification: "Verify chain hash continuity during replay"
    - step: 3
      action: "Verify final state matches expected state"
      verification: "Run full_verification on recovered ledger"
    - step: 4
      action: "Create a new checkpoint at recovery point"
      verification: "Quorum-sign the recovery checkpoint"
  guarantees:
    data_loss: "Zero data loss if entries were durably committed"
    consistency: "Recovered state is identical to pre-failure state"
    determinism: "Recovery replay produces identical state"
  fallback:
    - "If no valid checkpoint found, replay from genesis"
    - "If entries are corrupted, recover from replicated node"
    - "If all replicas corrupted, alert operator and halt"

invariants:
  - "The ledger is STRICTLY append-only — no updates, no deletes"
  - "Chain hash integrity MUST be maintained at all times"
  - "Every entry MUST have a valid signature"
  - "Replay sequence MUST be strictly monotonically increasing"
  - "Checkpoints MUST be quorum-signed"
  - "Tamper detection MUST run continuously"
  - "Recovery MUST be deterministic and produce identical state"
