// PheonixCore — Canonical Contract System
// Enforcement Protocol Definition — Enforcement Requests, Approvals, Execution, Kill Switch
// ALL repos depend on PheonixCore contracts. NO other repo may export cross-boundary types.

syntax = "proto3";

package phoenix.enforcement.v1;

option go_package = "github.com/fallofpheonix/PheonixCore/proto/v1/enforcement";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// RollbackPlan defines how to safely reverse an enforcement action.
message RollbackPlan {
  string rollback_id = 1;
  string target_state = 2;
  repeated string inverse_steps = 3;
  google.protobuf.Timestamp deadline = 4;
  string verification = 5;

  // --- Mandatory canonical fields ---
  string schema_version = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  string source_repo = 9;
  uint64 replay_sequence = 10;
  string validation_hash = 11;
}

// EnforcementRequest initiates an enforcement action.
// All enforcement actions MUST have a rollback plan and approval chain.
message EnforcementRequest {
  string request_id = 1;
  string target = 2;
  string action = 3;
  string scope = 4;
  google.protobuf.Duration timeout = 5;
  RollbackPlan rollback_plan = 6;
  uint64 replay_marker = 7;
  repeated string approval_chain = 8;

  // --- Mandatory canonical fields ---
  string schema_version = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  string source_repo = 12;
  uint64 replay_sequence = 13;
  string validation_hash = 14;
}

// EnforcementApproval records an approval or denial of an enforcement request.
message EnforcementApproval {
  string approval_id = 1;
  string request_id = 2;
  string approver = 3;
  string decision = 4;
  repeated string conditions = 5;
  google.protobuf.Timestamp expiry = 6;
  string signature = 7;

  // --- Mandatory canonical fields ---
  string schema_version = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  string source_repo = 11;
  uint64 replay_sequence = 12;
  string validation_hash = 13;
}

// ExecutionPlan defines the ordered steps for executing an enforcement action.
message ExecutionPlan {
  string plan_id = 1;
  repeated string steps = 2;
  bool deterministic_order = 3;
  repeated string preconditions = 4;
  repeated string rollback_steps = 5;

  // --- Mandatory canonical fields ---
  string schema_version = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  string source_repo = 9;
  uint64 replay_sequence = 10;
  string validation_hash = 11;
}

// ExecutionResult records the outcome of an enforcement action.
message ExecutionResult {
  string result_id = 1;
  string request_id = 2;
  bool success = 3;
  repeated string applied_steps = 4;
  repeated string errors = 5;
  string final_state = 6;
  uint64 replay_marker = 7;

  // --- Mandatory canonical fields ---
  string schema_version = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  string source_repo = 11;
  uint64 replay_sequence = 12;
  string validation_hash = 13;
}

// KillSwitchState represents the system-wide kill switch.
// When activated, all non-essential operations MUST halt immediately.
message KillSwitchState {
  string switch_id = 1;
  string mode = 2;
  string reason = 3;
  string activated_by = 4;
  google.protobuf.Duration duration = 5;
  repeated string recovery_conditions = 6;

  // --- Mandatory canonical fields ---
  string schema_version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string source_repo = 10;
  uint64 replay_sequence = 11;
  string validation_hash = 12;
}
