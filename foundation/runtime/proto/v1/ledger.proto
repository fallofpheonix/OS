// PheonixCore — Canonical Contract System
// Ledger Protocol Definition — Append-Only Evidence Ledger
// ALL repos depend on PheonixCore contracts. NO other repo may export cross-boundary types.

syntax = "proto3";

package phoenix.ledger.v1;

option go_package = "github.com/fallofpheonix/phoenix/foundation/runtime/proto/v1/ledger";

import "google/protobuf/timestamp.proto";

// EvidenceRecord represents a single piece of cryptographic evidence
// recorded in the append-only ledger.
message EvidenceRecord {
  string evidence_id = 1;
  string source_ref = 2;
  string evidence_hash = 3;
  string source_repo = 4;
  string source_component = 5;
  google.protobuf.Timestamp timestamp = 6;
  double trust_score = 7;
  string signature = 8;
  string lineage_ref = 9;

  // --- Mandatory canonical fields ---
  string schema_version = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  uint64 replay_sequence = 13;
  string validation_hash = 14;
}

// TransitionProof provides cryptographic proof that a state transition
// was valid according to the FSM contract.
message TransitionProof {
  string proof_id = 1;
  string from_state = 2;
  string to_state = 3;
  string preimage_hash = 4;
  repeated string validator_set = 5;
  uint64 replay_marker = 6;
  string signature = 7;

  // --- Mandatory canonical fields ---
  string schema_version = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  string source_repo = 11;
  uint64 replay_sequence = 12;
  string validation_hash = 13;
}

// LedgerEntry is a single append-only entry in the evidence ledger.
// Once written, a LedgerEntry MUST NEVER be modified or deleted.
message LedgerEntry {
  string entry_id = 1;
  EvidenceRecord evidence_record = 2;
  string state_before = 3;
  string state_after = 4;
  TransitionProof transition_proof = 5;
  uint64 replay_sequence = 6;
  string checkpoint_id = 7;
  string signature = 8;

  // --- Mandatory canonical fields ---
  string schema_version = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  string source_repo = 12;
  string validation_hash = 13;
}

// VerificationResult records the outcome of verifying a ledger entry
// for integrity, tamper-detection, and chain consistency.
message VerificationResult {
  string verification_id = 1;
  string ledger_entry_id = 2;
  string status = 3;
  bool tamper_detected = 4;
  string checksum = 5;
  string verifier = 6;
  string signature = 7;

  // --- Mandatory canonical fields ---
  string schema_version = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  string source_repo = 11;
  uint64 replay_sequence = 12;
  string validation_hash = 13;
}

// ChainCheckpoint represents a periodic checkpoint of the ledger chain
// for fast verification and recovery.
message ChainCheckpoint {
  string checkpoint_id = 1;
  string last_entry_id = 2;
  string cumulative_hash = 3;
  repeated string validator_quorum = 4;
  google.protobuf.Timestamp timestamp = 5;
  string signature = 6;

  // --- Mandatory canonical fields ---
  string schema_version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string source_repo = 10;
  uint64 replay_sequence = 11;
  string validation_hash = 12;
}
