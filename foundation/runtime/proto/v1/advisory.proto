// PheonixCore — Canonical Contract System
// Advisory Protocol Definition — Advisory Envelopes, Recommendations, Evidence Bundles
// ALL repos depend on PheonixCore contracts. NO other repo may export cross-boundary types.

syntax = "proto3";

package phoenix.advisory.v1;

option go_package = "github.com/fallofpheonix/PheonixCore/proto/v1/advisory";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// Recommendation captures a specific advisory recommendation with impact analysis.
message Recommendation {
  string recommendation_id = 1;
  string type = 2;
  string summary = 3;
  string impact = 4;
  repeated string alternatives = 5;
  string operator_action = 6;
  string confidence_ref = 7;

  // --- Mandatory canonical fields ---
  string schema_version = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  string source_repo = 11;
  uint64 replay_sequence = 12;
  string validation_hash = 13;
}

// EvidenceBundle groups related evidence references for advisory decisions.
message EvidenceBundle {
  string bundle_id = 1;
  repeated string evidence_refs = 2;
  repeated string lineage_refs = 3;
  double trust_floor = 4;
  string provenance = 5;
  string checksum = 6;

  // --- Mandatory canonical fields ---
  string schema_version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string source_repo = 10;
  uint64 replay_sequence = 11;
  string validation_hash = 12;
}

// AdvisoryEnvelope is the canonical advisory message.
// Advisories are NEVER commands — they are bounded recommendations
// that require evidence and may require operator approval.
message AdvisoryEnvelope {
  string advisory_id = 1;
  string advisory_version = 2;
  Recommendation recommendation = 3;
  EvidenceBundle evidence_bundle = 4;
  double confidence = 5;
  double risk_score = 6;
  string bounded_scope = 7;
  google.protobuf.Timestamp expiration = 8;
  bool approval_required = 9;
  repeated string forbidden_actions = 10;
  string signature = 11;

  // --- Mandatory canonical fields ---
  string schema_version = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  string source_repo = 15;
  uint64 replay_sequence = 16;
  string validation_hash = 17;
}

// ConfidenceModel captures the statistical model behind an advisory's confidence score.
message ConfidenceModel {
  string model_id = 1;
  double score = 2;
  double calibration = 3;
  double uncertainty = 4;
  string explanation = 5;
  repeated string source_weights = 6;

  // --- Mandatory canonical fields ---
  string schema_version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string source_repo = 10;
  uint64 replay_sequence = 11;
  string validation_hash = 12;
}

// ApprovalRequest is generated when an advisory requires human or elevated approval.
message ApprovalRequest {
  string approval_id = 1;
  string advisory_id = 2;
  string requested_by = 3;
  string requested_scope = 4;
  string approver_role = 5;
  google.protobuf.Duration timeout = 6;
  string rollback_plan = 7;

  // --- Mandatory canonical fields ---
  string schema_version = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  string source_repo = 11;
  uint64 replay_sequence = 12;
  string validation_hash = 13;
}
