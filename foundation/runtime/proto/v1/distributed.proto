// PheonixCore — Canonical Contract System
// Distributed Protocol Definition — Node Identity, Consensus, Replication, Quorum
// ALL repos depend on PheonixCore contracts. NO other repo may export cross-boundary types.

syntax = "proto3";

package phoenix.distributed.v1;

option go_package = "github.com/fallofpheonix/PheonixCore/proto/v1/distributed";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// NodeIdentity represents a node in the distributed PhoenixOS topology.
message NodeIdentity {
  string node_id = 1;
  string repo = 2;
  string authority_level = 3;
  string public_key = 4;
  string region = 5;
  uint64 epoch = 6;

  // --- Mandatory canonical fields ---
  string schema_version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string source_repo = 10;
  uint64 replay_sequence = 11;
  string validation_hash = 12;
}

// AuthorityCertificate certifies a node's authority within a given scope.
message AuthorityCertificate {
  string cert_id = 1;
  string node_id = 2;
  string authority_scope = 3;
  string issuer = 4;
  google.protobuf.Timestamp expires_at = 5;
  string signature = 6;

  // --- Mandatory canonical fields ---
  string schema_version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string source_repo = 10;
  uint64 replay_sequence = 11;
  string validation_hash = 12;
}

// ReplicationEvent records a ledger replication across nodes.
message ReplicationEvent {
  string replication_id = 1;
  string ledger_ref = 2;
  uint64 version = 3;
  string source_node = 4;
  repeated string target_nodes = 5;
  string checksum = 6;

  // --- Mandatory canonical fields ---
  string schema_version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string source_repo = 10;
  uint64 replay_sequence = 11;
  string validation_hash = 12;
}

// ConsensusState represents the current consensus state of the distributed system.
message ConsensusState {
  string consensus_id = 1;
  uint64 term = 2;
  string leader = 3;
  repeated string quorum = 4;
  uint64 commit_index = 5;
  string divergence_state = 6;

  // --- Mandatory canonical fields ---
  string schema_version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string source_repo = 10;
  uint64 replay_sequence = 11;
  string validation_hash = 12;
}

// QuorumProof provides cryptographic proof that a quorum was reached.
message QuorumProof {
  string proof_id = 1;
  repeated string accepted_nodes = 2;
  uint32 threshold = 3;
  repeated string signatures = 4;
  string evidence_hash = 5;

  // --- Mandatory canonical fields ---
  string schema_version = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  string source_repo = 9;
  uint64 replay_sequence = 10;
  string validation_hash = 11;
}

// SynchronizationResult records the outcome of a node synchronization.
message SynchronizationResult {
  string sync_id = 1;
  string node_id = 2;
  string status = 3;
  google.protobuf.Duration lag = 4;
  string recovered_state = 5;
  uint64 replay_marker = 6;

  // --- Mandatory canonical fields ---
  string schema_version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string source_repo = 10;
  uint64 replay_sequence = 11;
  string validation_hash = 12;
}
