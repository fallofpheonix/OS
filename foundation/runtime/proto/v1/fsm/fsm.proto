// PheonixCore — Canonical Contract System
// FSM Serialization Schema — Warden and Consensus States
// ALL repos depend on PheonixCore contracts.

syntax = "proto3";

package phoenix.fsm.v1;

option go_package = "github.com/fallofpheonix/PheonixCore/proto/v1/fsm";

import "google/protobuf/timestamp.proto";

enum SystemState {
  SYSTEM_STATE_UNSPECIFIED = 0;
  SYSTEM_STATE_SAFE = 1;
  SYSTEM_STATE_WATCH = 2;
  SYSTEM_STATE_SUSPICIOUS = 3;
  SYSTEM_STATE_CRITICAL = 4;
  SYSTEM_STATE_COMPROMISED = 5;
}

// WardenState represents the deterministic state of the Warden FSM.
message WardenState {
  SystemState current_state = 1;
  bool locked = 2;
  uint64 last_transition_ns = 3; // Fixed-width monotonic timestamp
}

// ConsensusState represents the distributed agreement state.
message ConsensusState {
  uint32 active_nodes = 1;
  uint64 quorum_weight_raw = 2; // Scaled integer to avoid floating point (weight * 1,000,000)
}

// FSMStateBlock is the bit-level serializable block for a single point in time.
message FSMStateBlock {
  WardenState warden = 1;
  ConsensusState consensus = 2;
  
  // Chain of Custody
  string pre_state_hash = 3;
  string post_state_hash = 4;
  
  // Mandatory metadata
  uint64 replay_sequence = 5;
  string validation_hash = 6;
}
