// PheonixCore — Canonical Contract System
// Trace Protocol Definition — Lineage Graphs, Causal Chains, Process Graphs
// ALL repos depend on PheonixCore contracts. NO other repo may export cross-boundary types.

syntax = "proto3";

package phoenix.trace.v1;

option go_package = "github.com/fallofpheonix/PheonixCore/proto/v1/trace";

import "google/protobuf/timestamp.proto";

// TraceNode represents a single node in the causal trace graph.
message TraceNode {
  string node_id = 1;
  string source_event = 2;
  repeated string process_lineage = 3;
  repeated string telemetry_refs = 4;
  repeated string evidence_refs = 5;
  google.protobuf.Timestamp timestamp = 6;
  double trust = 7;

  // --- Mandatory canonical fields ---
  string schema_version = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  string source_repo = 11;
  uint64 replay_sequence = 12;
  string validation_hash = 13;
}

// TraceEdge represents a directed edge between two trace nodes
// with causal strength and ordering metadata.
message TraceEdge {
  string edge_id = 1;
  string from_node = 2;
  string to_node = 3;
  string relation_type = 4;
  double causal_strength = 5;
  uint64 ordering = 6;

  // --- Mandatory canonical fields ---
  string schema_version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string source_repo = 10;
  uint64 replay_sequence = 11;
  string validation_hash = 12;
}

// LineageGraph is the complete causal graph for a trace session.
message LineageGraph {
  string graph_id = 1;
  repeated TraceNode nodes = 2;
  repeated TraceEdge edges = 3;
  string checkpoint = 4;
  string root = 5;

  // --- Mandatory canonical fields ---
  string schema_version = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  string source_repo = 9;
  uint64 replay_sequence = 10;
  string validation_hash = 11;
}

// CausalChain represents an ordered sequence of causally linked events.
message CausalChain {
  string chain_id = 1;
  repeated string ordered_nodes = 2;
  repeated string parent_links = 3;
  uint64 replay_sequence = 4;
  string explanation = 5;

  // --- Mandatory canonical fields ---
  string schema_version = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  string source_repo = 9;
  string validation_hash = 10;
}

// ProcessGraph represents a process tree with lifecycle metadata.
message ProcessGraph {
  string process_id = 1;
  string pid = 2;
  string parent_pid = 3;
  repeated string node_links = 4;
  string lifecycle = 5;
  string host = 6;

  // --- Mandatory canonical fields ---
  string schema_version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string source_repo = 10;
  uint64 replay_sequence = 11;
  string validation_hash = 12;
}

// EvidenceLink connects a piece of evidence to a trace node.
message EvidenceLink {
  string link_id = 1;
  string evidence_id = 2;
  string trace_node_id = 3;
  string relation = 4;
  string hash = 5;

  // --- Mandatory canonical fields ---
  string schema_version = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  string source_repo = 9;
  uint64 replay_sequence = 10;
  string validation_hash = 11;
}
