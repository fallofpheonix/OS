// PheonixCore — Canonical Contract System
// Simulation Protocol Definition — Scenarios, Synthetic Worlds, Agents, Metrics
// ALL repos depend on PheonixCore contracts. NO other repo may export cross-boundary types.

syntax = "proto3";

package phoenix.simulation.v1;

option go_package = "github.com/fallofpheonix/PheonixCore/proto/v1/simulation";

import "google/protobuf/timestamp.proto";

// SimulationAgent represents an agent within a simulation scenario.
message SimulationAgent {
  string agent_id = 1;
  string role = 2;
  repeated string capabilities = 3;
  string state = 4;
  repeated string constraints = 5;

  // --- Mandatory canonical fields ---
  string schema_version = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  string source_repo = 9;
  uint64 replay_sequence = 10;
  string validation_hash = 11;
}

// ScenarioMetrics captures quantitative metrics for a simulation run.
message ScenarioMetrics {
  string metrics_id = 1;
  double latency = 2;
  double determinism_score = 3;
  double reproducibility_score = 4;
  double coverage = 5;
  double stability = 6;

  // --- Mandatory canonical fields ---
  string schema_version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string source_repo = 10;
  uint64 replay_sequence = 11;
  string validation_hash = 12;
}

// SimulationScenario defines a complete simulation test scenario.
message SimulationScenario {
  string scenario_id = 1;
  string seed = 2;
  string world_config = 3;
  repeated SimulationAgent agent_set = 4;
  repeated string expected_outcomes = 5;
  uint64 replay_sequence = 6;

  // --- Mandatory canonical fields ---
  string schema_version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string source_repo = 10;
  string validation_hash = 11;
}

// SyntheticWorld defines the world configuration for a simulation.
message SyntheticWorld {
  string world_id = 1;
  string topology = 2;
  string rules = 3;
  string initial_state = 4;
  string deterministic_seed = 5;

  // --- Mandatory canonical fields ---
  string schema_version = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  string source_repo = 9;
  uint64 replay_sequence = 10;
  string validation_hash = 11;
}

// SimulationEvent records a single step in a simulation execution.
message SimulationEvent {
  string sim_event_id = 1;
  string scenario_id = 2;
  uint64 step = 3;
  string actor = 4;
  string state_delta = 5;
  string checksum = 6;

  // --- Mandatory canonical fields ---
  string schema_version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string source_repo = 10;
  uint64 replay_sequence = 11;
  string validation_hash = 12;
}

// SimulationResult records the outcome of a simulation scenario execution.
message SimulationResult {
  string result_id = 1;
  string scenario_id = 2;
  string outcome = 3;
  string divergence = 4;
  ScenarioMetrics metrics = 5;
  uint64 replay_marker = 6;

  // --- Mandatory canonical fields ---
  string schema_version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string source_repo = 10;
  uint64 replay_sequence = 11;
  string validation_hash = 12;
}
