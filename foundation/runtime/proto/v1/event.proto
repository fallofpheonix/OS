// PheonixCore — Canonical Contract System
// Event Envelope Protocol Definition
// ALL repos depend on PheonixCore contracts. NO other repo may export cross-boundary types.

syntax = "proto3";

package phoenix.event.v1;

option go_package = "github.com/fallofpheonix/PheonixCore/proto/v1/event";

import "google/protobuf/timestamp.proto";

// EventEnvelope is the canonical envelope for all events in the PhoenixOS ecosystem.
// Every event emitted by any component MUST be wrapped in this envelope.
// The envelope provides deterministic replay, causal ordering, evidence hashing,
// and trust scoring for every event that flows through the system.
message EventEnvelope {
  // Unique identifier for this event instance
  string event_id = 1;

  // Semantic version of the event schema
  string event_version = 2;

  // Fully qualified event type (e.g., "phoenix.guard.state_transition")
  string event_type = 3;

  // Wall-clock timestamp of event creation
  google.protobuf.Timestamp timestamp = 4;

  // Monotonic nanosecond counter for causal ordering within a single node
  uint64 monotonic_time = 5;

  // Repository that produced this event
  string source_repo = 6;

  // Component within the source repo that produced this event
  string source_component = 7;

  // ID of the parent event that caused this event (empty if root)
  string parent_event = 8;

  // Correlation ID for tracing a logical operation across components
  string correlation_id = 9;

  // Ordered list of ancestor event IDs forming the causal chain
  repeated string causal_chain = 10;

  // Monotonically increasing sequence number for deterministic replay
  uint64 replay_sequence = 11;

  // Cryptographic hash of the evidence supporting this event
  string evidence_hash = 12;

  // Trust score assigned to this event (0.0 = untrusted, 1.0 = fully verified)
  double trust_score = 13;

  // Cryptographic signature of the event envelope
  string signature = 14;

  // Hash of the serialized payload for integrity verification
  string payload_hash = 15;

  // --- Mandatory canonical fields ---

  // Schema version for this message type
  string schema_version = 16;

  // Timestamp when this record was first created
  google.protobuf.Timestamp created_at = 17;

  // Timestamp when this record was last updated
  google.protobuf.Timestamp updated_at = 18;

  // Hash used to validate the integrity of this message
  string validation_hash = 19;
}
