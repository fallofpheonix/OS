name: CI

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Run Python tests
        run: |
          . .venv/bin/activate
          PYTHONPATH=$GITHUB_WORKSPACE pytest -q

  go-runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.0'
      - name: Install sqlite3 dev
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Run Go tests
        run: go test -v -race ./phoenix_os/...

  determinism-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.0'
      - name: Install sqlite3 dev
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Verify Determinism
        run: |
          mkdir -p build
          chmod +x scripts/verify_determinism.sh
          ./scripts/verify_determinism.sh
