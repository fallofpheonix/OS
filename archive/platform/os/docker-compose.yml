# PHOENIX MATRIX SOVEREIGN ARCHITECTURE
# [STATUS]: 18-Repository Substrate Consolidated
# [FUTURE ENHANCEMENT]: Needs continuous formal verification scaling and HDF5 vector optimizations.
# [POTENTIAL LOOPHOLE]: Ensure strict hardware isolation when deploying to bare-metal. Watch for timing side-channels.
# [ERROR PRONE AREA]: Concurrency bottlenecks in event bus and race conditions in cross-domain memory mappings.
version: '3.8'

# ==============================================================================
# THE PHOENIX MATRIX: Deterministic Substrate Geometry
# ==============================================================================
# Security Invariant: Mind and Guard networks MUST NEVER overlap directly.

networks:
  # The central nervous system. Only strictly defined events flow here.
  event-plane:
    driver: bridge
    internal: true # Isolated from the outside world by default

  # Intelligence boundary. Advisory systems live here.
  mind-containment:
    driver: bridge

  # Enforcement boundary. Actuation systems live here.
  guard-isolation:
    driver: bridge

volumes:
  # The immutable Merkle DAG memory.
  ledger-data:
    driver: local

services:
  # ----------------------------------------------------------------------------
  # CORE 0: Central Nervous System
  # ----------------------------------------------------------------------------
  event-bus:
    image: rabbitmq:3.12-management-alpine # Placeholder for lightweight broker
    container_name: phoenix-event-bus
    hostname: event-bus
    networks:
      - event-plane
      - mind-containment
      - guard-isolation
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"

  # ----------------------------------------------------------------------------
  # PILLAR 1: Immutable Truth (The Memory)
  # ----------------------------------------------------------------------------
  ledger-node:
    image: local/phoenix-distributed:latest
    container_name: phoenix-ledger
    build:
      context: ../PhoenixDistributed
      dockerfile: Dockerfile
    volumes:
      - ledger-data:/var/lib/phoenix/ledger
    networks:
      - event-plane
    environment:
      - PHOENIX_NODE_ROLE=LEDGER
      - LOGICAL_CLOCK_START=${PHOENIX_LOGICAL_CLOCK_START}
    depends_on:
      event-bus:
        condition: service_healthy
    restart: on-failure

  # ----------------------------------------------------------------------------
  # PILLAR 2: Advisory Intelligence (The Brains)
  # ----------------------------------------------------------------------------
  mind-node:
    image: local/phoenix-mind:latest
    container_name: phoenix-mind
    build:
      context: ../PhoenixMind
      dockerfile: Dockerfile
    networks:
      # Mind is connected to its containment and the event bus, but NOT guard
      - mind-containment
      - event-plane
    environment:
      - PHOENIX_NODE_ROLE=ADVISORY
      - CONFIDENCE_FLOOR=${PHOENIX_CONFIDENCE_FLOOR}
    depends_on:
      event-bus:
        condition: service_healthy
      ledger-node:
        condition: service_started
    restart: on-failure

  # ----------------------------------------------------------------------------
  # PILLAR 3: Fast-Path Enforcement (The Brawn)
  # ----------------------------------------------------------------------------
  guard-node:
    image: local/phoenix-guard:latest
    container_name: phoenix-guard
    build:
      context: ../PhoenixGuard
      dockerfile: Dockerfile
    networks:
      # Guard is isolated and only listens to authorized contracts on the bus
      - guard-isolation
      - event-plane
    environment:
      - PHOENIX_NODE_ROLE=WARDEN
      - ROLLBACK_TIMEOUT=${PHOENIX_ROLLBACK_TIMEOUT}
    depends_on:
      event-bus:
        condition: service_healthy
      ledger-node:
        condition: service_started
    restart: on-failure
    cap_add:
      - NET_ADMIN # Required for hypothetical Warden enforcement rules
