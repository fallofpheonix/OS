# PHOENIX MATRIX SOVEREIGN ARCHITECTURE
# [STATUS]: 18-Repository Substrate Consolidated
# [FUTURE ENHANCEMENT]: Needs continuous formal verification scaling and HDF5 vector optimizations.
# [POTENTIAL LOOPHOLE]: Ensure strict hardware isolation when deploying to bare-metal. Watch for timing side-channels.
# [ERROR PRONE AREA]: Concurrency bottlenecks in event bus and race conditions in cross-domain memory mappings.
# PHOENIX MATRIX RED-LINE POLICIES
# Phase: Stage A (Hardening)

actuation:
  mode: "ADVISORY" # Options: LOG_ONLY, ADVISORY, AUTO_ISOLATE
  default_priority: 0.5

gates:
  min_oracle_confidence: 0.90
  min_telemetry_confidence (tcs): 0.95
  max_reaction_time_ms: 100

phase_locks:
  kernel_write: DISABLED
  training_engine: LOCKED
  proposal_engine: LOCKED

escalation:
  # Do not allow jump to COMPROMISED unless entropy > 8.0
  extreme_entropy_threshold: 8.0
  allow_state_skipping: false
