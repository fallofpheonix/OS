telemetry_model:
  metrics:
    repo_count:
      description: Total number of repositories in the ecosystem
      unit: count
    archive_ratio:
      description: Ratio of archived repos to total repos
      unit: percentage
    runtime_ratio:
      description: Ratio of active runtimes to repos
      unit: ratio
    dependency_density:
      description: Average number of dependencies per repo
      unit: density
    research_density:
      description: Percentage of repos with research lineage
      unit: percentage
    risk_density:
      description: Distribution of risk levels across the ecosystem
      unit: map
    validation_score:
      description: Global ecosystem integrity score
      unit: float (0.0 - 1.0)
