topology:
  layers:
    - id: working_memory
      type: transient
      capacity: 10
      latency: 0.001
    - id: episodic_memory
      type: persistent
      capacity: 10000
      latency: 0.05
    - id: semantic_memory
      type: persistent
      capacity: 100000
      latency: 0.1
  connectivity:
    - from: working_memory
      to: episodic_memory
      type: consolidation
    - from: episodic_memory
      to: semantic_memory
      type: abstraction
