checks:
  github_exists:
    description: "Verify remote repository is accessible"
    command: "git ls-remote {{github_url}}"
    type: NETWORK
  local_exists:
    description: "Verify local path exists or is creatable"
    command: "test -d {{local_path}}"
    type: FILESYSTEM
  editable:
    description: "Check if module is installed in editable mode"
    command: "pip list --editable | grep {{repo}}"
    type: RUNTIME
  runtime_valid:
    description: "Ensure runtime environment matches requirements"
    command: "python --version"
    type: ENVIRONMENT
  cache_valid:
    description: "Verify cache integrity"
    command: "test -f {{cache_path}}/{{repo}}.tar.gz"
    type: CACHE
  restore_valid:
    description: "Verify restore point is reachable"
    command: "test -d {{restore_path}}"
    type: BACKUP

scenarios:
  LOCAL_EDIT: [local_exists, runtime_valid]
  UV_EDITABLE: [github_exists, local_exists, editable, runtime_valid]
  INSTALL_ONLY: [github_exists, runtime_valid]
  CACHE_TEMP: [cache_valid, restore_valid]
