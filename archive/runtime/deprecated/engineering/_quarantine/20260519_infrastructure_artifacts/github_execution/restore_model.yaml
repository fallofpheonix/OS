- repo: fallofpheonix
  source: github
  archive: archive/github_synced/fallofpheonix
  cache: false
  clone: manual
  install: local
  rollback: archive_restore
- repo: agents
  source: github
  archive: archive/deprecated/agents
  cache: github_cache/agents
  clone: on_demand
  install: uv_editable
  rollback: cache_restore
- repo: physics
  source: github
  archive: archive/runtime_snapshots/physics
  cache: github_cache/physics
  clone: sparse
  install: cache_only
  rollback: git_reset
- repo: truenotes
  source: github
  archive: archive/github_synced/truenotes
  cache: github_cache/truenotes
  clone: full
  install: pip_install
  rollback: re_clone
