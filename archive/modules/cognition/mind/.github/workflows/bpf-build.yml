name: Build BPF Kernel Objects
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    steps:
      - uses: actions/checkout@v3
      - name: Install Dependencies
        run: |
          apt-get update && apt-get install -y clang llvm libbpf-dev linux-headers-generic
      - name: Compile BPF
        run: |
          clang -O2 -g -target bpf -c phoenix_os/warden/ebpf/src/egress_policy.c -o phoenix_os/warden/ebpf/src/egress_policy.o
          clang -O2 -g -target bpf -c phoenix_os/warden/ebpf/src/xdp_ingress.c -o phoenix_os/warden/ebpf/src/xdp_ingress.o
      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: bpf-bytecode
          path: phoenix_os/warden/ebpf/src/*.o
