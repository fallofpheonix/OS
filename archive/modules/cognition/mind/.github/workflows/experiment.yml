name: Experiment Runner

on:
  workflow_dispatch:
  push:
    paths:
      - '14_experiments/**'

jobs:
  run-experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22.0'

      - name: Run Telemetry Replay Experiment
        run: |
          cd 14_experiments/telemetry_replay
          go build -o telemetry_replay main.go
          ./telemetry_replay --out ../../results/experiment
          
      - name: Upload Experiment Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: results/experiment/
