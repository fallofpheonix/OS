immutable_repos:
  - fallofpheonix
  - brain
  - forge-agent
  - control-plane
  - infrastructure
  - astraeus-core
  - ecosystem_os
  - runtime

rules:
  restrict_push:
    target: immutable_repos
    allowed_roles: [admin, system]
    description: "Manual push forbidden for these repositories except by authorized actors."
  no_force:
    target: immutable_repos
    action: REJECT
    description: "Force pushing is strictly prohibited for core infrastructure."
  audit_required:
    target: immutable_repos
    condition: on_push
    action: LOG_TELEMETRY
  purge_exemption:
    target: immutable_repos
    action: KEEP_LOCAL
    description: "Never purge or cache-only these repositories."
