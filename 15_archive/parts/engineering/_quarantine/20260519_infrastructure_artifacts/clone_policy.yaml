clone_policy:
  rules:
    - frequency: frequently_edited
      target_location: workspace/active
      criteria: "Active development, daily commits, core runtime dependency"
    - frequency: occasional_edits
      target_location: github_cache
      criteria: "Maintenance mode, quarterly updates, stable API"
    - frequency: stable
      target_location: modules/installable
      criteria: "Frozen API, published package, immutable dependency"
    - frequency: legacy
      target_location: archive
      criteria: "No planned updates, deprecated, historical reference only"

  mappings:
    brain: active
    astraeus-core: active
    forge-agent: active
    fallofpheonix: active
    TrustLab: active
    idea: active
    control-plane: active
    aegis-auth: active
    agents: active
    truenotes: active
    autoeit-suite: active
    gametrend-intelligence-engine: active
    ledger-core: active
    OS: active
    smart-api-limiter: active
    codes: active
    my-portfolio: active
    cognitron-game: archive
    LAMP: archive
    SecureForg: archive
    TerraHerb: archive
    AutoMation-Engine: archive
