lifecycle:
  states:
    - IDEA
    - EXPERIMENTAL
    - ACTIVE
    - PRODUCT
    - LEGACY
    - ARCHIVED
  transitions:
    - from: IDEA
      to: EXPERIMENTAL
      conditions:
        - Research mapping mandatory
    - from: EXPERIMENTAL
      to: ACTIVE
      conditions:
        - Runtime validation required
        - Ownership required
    - from: ACTIVE
      to: PRODUCT
      conditions:
        - Boundary checks enforced
        - Criticality assessment complete
    - from: PRODUCT
      to: LEGACY
      conditions:
        - Maintenance mode enabled
    - from: LEGACY
      to: ARCHIVED
      conditions:
        - Manifest first
        - No delete without archive
