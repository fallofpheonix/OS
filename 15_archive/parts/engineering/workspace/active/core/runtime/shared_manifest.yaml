shared_runtime:
  path: "runtime/shared"
  type: "shared"
  python: "3.14.3"
  state: "LIVE"
  lock_source: "site-packages"

core_runtime:
  path: "runtime/core"
  type: "core"
  python: "3.13.12"
  state: "LOCKED"
  lock_source: "uv.lock"

research_runtime:
  path: "runtime/research"
  type: "research"
  python: "3.14.3"
  state: "FROZEN"
  lock_source: "requirements.txt"

archive_runtime:
  path: "archive/runtime"
  type: "archive"
  python: "various"
  state: "DEPRECATED"
  lock_source: "none"

python_targets:
  core: "3.13.12"
  research: "3.14.3"
  shared: "3.14.3"

lock_sources:
  - "workspace/active/astraeus-core/uv.lock"
  - "environments/ai-system/requirements.txt"
  - ".venv/lib/python3.14/site-packages"

dependency_state:
  core: "AUDITED"
  research: "COLLAPSE_READY"
  shared: "SHARED_READY"
  overall: "VALIDATED"

conflict_state:
  requests:
    versions: ["2.34.0", "2.34.1"]
    impact: "MEDIUM"
  tokenizers:
    versions: ["0.22.2", "0.23.1"]
    impact: "MEDIUM"
  python_version:
    drift: "3.13.12 vs 3.14.3"
    impact: "LOW"

rollback_paths:
  core: "workspace/active/astraeus-core/uv.lock"
  research: "environments/ai-system/requirements.txt"
  shared: ".venv/lib/python3.14/site-packages"
