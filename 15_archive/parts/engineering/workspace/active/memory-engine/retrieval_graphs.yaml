graphs:
  retrieval_flow:
    nodes:
      - id: query_vector
        type: input
      - id: index_lookup
        type: process
      - id: candidate_ranker
        type: process
      - id: result_set
        type: output
    edges:
      - from: query_vector
        to: index_lookup
      - from: index_lookup
        to: candidate_ranker
      - from: candidate_ranker
        to: result_set
