[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-agent"
version = "0.1.0"
description = "Execution-first AI engineering assistant"
requires-python = ">=3.11"
dependencies = [
  "typer",
  "rich",
  "python-dotenv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend = "../../../infrastructure/python/ruff/ruff.toml"

[tool.mypy]
config_file = "../../../infrastructure/python/mypy/mypy.ini"
