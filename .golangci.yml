# golangci-lint config for the Phoenix workspace.
# Applied per-module (each module's go.mod is the entry point).
#
# Pinned to a permissive baseline that catches real bugs without
# blocking on stylistic preferences. Tighten as the project matures.

run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck       # unchecked errors
    - govet          # standard vet
    - ineffassign    # unused assignments
    - staticcheck    # static analysis
    - unused         # unused vars/funcs/types
    - gosimple       # simplifications
    - gocritic       # opinionated style/bugs
    - gofmt          # formatting
    - goimports      # import ordering

linters-settings:
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - hugeParam
      - rangeValCopy
  gofmt:
    simplify: true

issues:
  # Don't fail the build on style noise; keep CI focused on correctness.
  max-issues-per-linter: 50
  max-same-issues: 10
  exclude-use-default: false
  exclude-rules:
    # Exclude intentional panics in recovery code
    - path: _test\.go
      linters:
        - errcheck
        - gosimple
    - path: warden_compat\.go
      linters:
        - gocritic
