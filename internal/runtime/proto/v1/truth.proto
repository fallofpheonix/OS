// PheonixCore — Canonical Contract System
// Truth Protocol Definition — Evidence Assessment, Contradictions, Truth Reports
// ALL repos depend on PheonixCore contracts. NO other repo may export cross-boundary types.

syntax = "proto3";

package phoenix.truth.v1;

option go_package = "github.com/fallofpheonix/phoenix/foundation/runtime/proto/v1/truth";

import "google/protobuf/timestamp.proto";

// Evidence represents a single piece of verified evidence.
message Evidence {
  string evidence_id = 1;
  string evidence_hash = 2;
  string source = 3;
  string payload_ref = 4;
  google.protobuf.Timestamp timestamp = 5;
  double trust_floor = 6;

  // --- Mandatory canonical fields ---
  string schema_version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string source_repo = 10;
  uint64 replay_sequence = 11;
  string validation_hash = 12;
}

// EvidenceSource identifies the origin and authority level of evidence.
message EvidenceSource {
  string source_id = 1;
  string repo = 2;
  string component = 3;
  string authority_level = 4;
  string signature_key = 5;
  uint32 ranking = 6;

  // --- Mandatory canonical fields ---
  string schema_version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string source_repo = 10;
  uint64 replay_sequence = 11;
  string validation_hash = 12;
}

// TruthAssessment is the system's conclusion about a set of evidence.
message TruthAssessment {
  string assessment_id = 1;
  repeated string evidence_ids = 2;
  string conclusion = 3;
  double confidence = 4;
  repeated string contradiction_refs = 5;
  string rationale = 6;

  // --- Mandatory canonical fields ---
  string schema_version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string source_repo = 10;
  uint64 replay_sequence = 11;
  string validation_hash = 12;
}

// ConfidenceAssessment provides detailed confidence scoring with calibration.
message ConfidenceAssessment {
  string confidence_id = 1;
  double score = 2;
  repeated double weights = 3;
  double calibration = 4;
  double uncertainty = 5;
  string explanation = 6;

  // --- Mandatory canonical fields ---
  string schema_version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string source_repo = 10;
  uint64 replay_sequence = 11;
  string validation_hash = 12;
}

// Contradiction records when two pieces of evidence conflict.
message Contradiction {
  string contradiction_id = 1;
  string evidence_a = 2;
  string evidence_b = 3;
  string severity = 4;
  string resolution = 5;
  string detector = 6;

  // --- Mandatory canonical fields ---
  string schema_version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string source_repo = 10;
  uint64 replay_sequence = 11;
  string validation_hash = 12;
}

// TruthReport is a comprehensive truth assessment report.
message TruthReport {
  string report_id = 1;
  repeated TruthAssessment assessments = 2;
  repeated Contradiction contradictions = 3;
  string confidence_summary = 4;
  string signature = 5;
  string version = 6;

  // --- Mandatory canonical fields ---
  string schema_version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string source_repo = 10;
  uint64 replay_sequence = 11;
  string validation_hash = 12;
}
