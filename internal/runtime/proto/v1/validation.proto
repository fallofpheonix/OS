// PheonixCore — Canonical Contract System
// Validation Protocol Definition — Replay Scenarios, Chaos Experiments, Invariant Checks
// ALL repos depend on PheonixCore contracts. NO other repo may export cross-boundary types.

syntax = "proto3";

package phoenix.validation.v1;

option go_package = "github.com/fallofpheonix/PheonixCore/proto/v1/validation";

import "google/protobuf/timestamp.proto";

// ReplayScenario defines a deterministic replay test scenario.
message ReplayScenario {
  string scenario_id = 1;
  string seed = 2;
  repeated string inputs = 3;
  string expected_state = 4;
  repeated string invariant_set = 5;
  uint64 replay_sequence = 6;

  // --- Mandatory canonical fields ---
  string schema_version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string source_repo = 10;
  string validation_hash = 11;
}

// ReplayArtifact captures the inputs and outputs of a replay execution.
message ReplayArtifact {
  string artifact_id = 1;
  string input_hash = 2;
  string output_hash = 3;
  repeated string logs = 4;
  repeated string traces = 5;
  google.protobuf.Timestamp timestamp = 6;

  // --- Mandatory canonical fields ---
  string schema_version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string source_repo = 10;
  uint64 replay_sequence = 11;
  string validation_hash = 12;
}

// ReplayResult records whether a replay scenario passed or failed.
message ReplayResult {
  string result_id = 1;
  string scenario_id = 2;
  bool pass_fail = 3;
  string divergence = 4;
  string checksum = 5;
  string remediation = 6;

  // --- Mandatory canonical fields ---
  string schema_version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string source_repo = 10;
  uint64 replay_sequence = 11;
  string validation_hash = 12;
}

// ChaosExperiment defines a controlled chaos testing scenario.
message ChaosExperiment {
  string experiment_id = 1;
  string scenario = 2;
  repeated string fault_injections = 3;
  string bounds = 4;
  repeated string recovery_conditions = 5;

  // --- Mandatory canonical fields ---
  string schema_version = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  string source_repo = 9;
  uint64 replay_sequence = 10;
  string validation_hash = 11;
}

// InvariantResult records the outcome of an invariant check.
message InvariantResult {
  string invariant_id = 1;
  string assertion = 2;
  string observed = 3;
  bool pass_fail = 4;
  string evidence = 5;

  // --- Mandatory canonical fields ---
  string schema_version = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  string source_repo = 9;
  uint64 replay_sequence = 10;
  string validation_hash = 11;
}

// ValidationReport is a comprehensive validation report covering all scenarios.
message ValidationReport {
  string report_id = 1;
  repeated string scenario_ids = 2;
  repeated ReplayResult results = 3;
  double score = 4;
  repeated string regressions = 5;
  string signature = 6;

  // --- Mandatory canonical fields ---
  string schema_version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string source_repo = 10;
  uint64 replay_sequence = 11;
  string validation_hash = 12;
}
