// PheonixCore — Canonical Contract System
// Memory Protocol Definition — Memory Records, Graphs, Semantic Links, Retrieval
// ALL repos depend on PheonixCore contracts. NO other repo may export cross-boundary types.

syntax = "proto3";

package phoenix.memory.v1;

option go_package = "github.com/fallofpheonix/PheonixCore/proto/v1/memory";

import "google/protobuf/timestamp.proto";

// MemoryRecord represents a single memory entry in the system.
message MemoryRecord {
  string record_id = 1;
  string memory_type = 2;
  string source_event = 3;
  string content_hash = 4;
  double trust_score = 5;
  string retention = 6;

  // --- Mandatory canonical fields ---
  string schema_version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string source_repo = 10;
  uint64 replay_sequence = 11;
  string validation_hash = 12;
}

// MemoryChunk represents a fragment of a memory record for chunked storage.
message MemoryChunk {
  string chunk_id = 1;
  string record_id = 2;
  uint64 sequence = 3;
  string semantic_vector_hash = 4;
  string checksum = 5;

  // --- Mandatory canonical fields ---
  string schema_version = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  string source_repo = 9;
  uint64 replay_sequence = 10;
  string validation_hash = 11;
}

// SemanticLink represents a semantic relationship between two memory records.
message SemanticLink {
  string link_id = 1;
  string from_record = 2;
  string to_record = 3;
  string relation = 4;
  double confidence = 5;

  // --- Mandatory canonical fields ---
  string schema_version = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  string source_repo = 9;
  uint64 replay_sequence = 10;
  string validation_hash = 11;
}

// MemoryGraph is the complete semantic memory graph.
message MemoryGraph {
  string graph_id = 1;
  repeated MemoryRecord nodes = 2;
  repeated SemanticLink links = 3;
  string lineage = 4;
  string snapshot_id = 5;

  // --- Mandatory canonical fields ---
  string schema_version = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  string source_repo = 9;
  uint64 replay_sequence = 10;
  string validation_hash = 11;
}

// RetrievalResult records the outcome of a memory retrieval query.
message RetrievalResult {
  string retrieval_id = 1;
  string query_hash = 2;
  repeated string matches = 3;
  repeated uint32 ranking = 4;
  string provenance = 5;
  string checksum = 6;

  // --- Mandatory canonical fields ---
  string schema_version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string source_repo = 10;
  uint64 replay_sequence = 11;
  string validation_hash = 12;
}

// MemorySnapshot captures the full state of the memory system at an epoch.
message MemorySnapshot {
  string snapshot_id = 1;
  uint64 epoch = 2;
  repeated MemoryRecord records = 3;
  string graph_root = 4;
  string signature = 5;

  // --- Mandatory canonical fields ---
  string schema_version = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  string source_repo = 9;
  uint64 replay_sequence = 10;
  string validation_hash = 11;
}
