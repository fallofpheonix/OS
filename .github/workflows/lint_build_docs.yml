name: Lint, Build, and RFC Validation

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/lint_build_docs.yml'

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install jsonschema flake8

      - name: Python Lint
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.venv

      - name: Validate JSON Schemas
        run: python scripts/validate_schemas.py

      - name: Validate RFC for Research Changes
        run: ./scripts/validate_rfc.sh main

  build-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      - name: Build Go Modules
        run: |
          if [ -f go.work ]; then
            echo "Building with go.work..."
            go build ./...
          else
            echo "Building individual modules..."
            modules=(
              "06_ai"
              "07_security"
              "09_telemetry"
              "10_kernel"
              "14_experiments/sentinel_mvp"
              "14_experiments/telemetry_replay"
              "agents"
            )
            for mod in "${modules[@]}"; do
              if [ -d "$mod" ]; then
                echo "Building $mod..."
                (cd "$mod" && go build ./...)
              fi
            done
          fi
