# Phoenix Workspace CI
#
# Validates every push and PR against the 12-module Phoenix workspace.
# Runs build, unit tests, race tests, vet, and golangci-lint for each module.
# Coverage is uploaded as an artifact and reported per module.
#
# Why per-module: the workspace is decomposed into Nucleus / Cognition /
# Crucible / Terminus / Arbiter, each with its own go.mod. Building
# from the workspace root validates cross-module interfaces; per-module
# coverage isolates regressions.
#
# Required check: "Phoenix CI / build-and-test" must pass before merge.

name: Phoenix CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  # -----------------------------------------------------------------------
  # Build + test matrix
  # -----------------------------------------------------------------------
  build-and-test:
    name: ${{ matrix.module }} / build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        module:
          - Phoenix.Cognition/PhoenixMind
          - Phoenix.Crucible/PhoenixRedteam
          - Phoenix.Crucible/PhoenixSimulation
          - Phoenix.Nucleus/PhoenixCore
          - Phoenix.Nucleus/PhoenixDistributed
          - Phoenix.Nucleus/PhoenixGuard
          - Phoenix.Nucleus/PhoenixTrace
          - Phoenix.Nucleus/PhoenixValidation
          - Phoenix.Nucleus/PhoenixKernel
          - Phoenix.Nucleus/PhoenixTruth
          - Phoenix.Terminus/PhoenixOS
          - Phoenix.Arbiter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Show workspace
        working-directory: ${{ github.workspace }}
        run: |
          echo "go.work:"
          cat go.work
          echo ""
          echo "Module: ${{ matrix.module }}"
          ls -la "${{ matrix.module }}"

      - name: Verify go.work lists this module
        working-directory: ${{ github.workspace }}
        run: |
          if ! grep -q "${{ matrix.module }}" go.work; then
            echo "::error::Module ${{ matrix.module }} is not listed in go.work"
            exit 1
          fi

      - name: go mod download
        working-directory: ${{ github.workspace }}
        run: go mod download

      - name: go build
        working-directory: ${{ github.workspace }}
        run: go build ./${{ matrix.module }}/...

      - name: go vet
        working-directory: ${{ github.workspace }}
        run: go vet ./${{ matrix.module }}/...

      - name: go test (no race)
        working-directory: ${{ github.workspace }}
        run: go test -count=1 ./${{ matrix.module }}/...

      - name: go test -race
        working-directory: ${{ github.workspace }}
        run: go test -race -count=1 ./${{ matrix.module }}/...

      - name: Coverage
        working-directory: ${{ github.workspace }}
        if: success()
        run: |
          mkdir -p coverage
          go test -count=1 -coverprofile=coverage/${{ matrix.module }}.out -covermode=atomic ./${{ matrix.module }}/... 2>&1 | tee coverage/${{ matrix.module }}.log

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: coverage-${{ strategy.job-index }}
          path: coverage/
          retention-days: 14

  # -----------------------------------------------------------------------
  # Aggregate linter
  # -----------------------------------------------------------------------
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/golangci-lint
          key: ${{ runner.os }}-golangci-lint-${{ hashFiles('**/.golangci.yml') }}
          restore-keys: ${{ runner.os }}-golangci-lint-

      - name: Run golangci-lint per module
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          for mod in $(grep -oE '\./[^ ]+' go.work); do
            echo "=== Linting $mod ==="
            (cd "$mod" && golangci-lint run --timeout 5m ./... 2>&1 | tee -a /tmp/lint.log) || {
              echo "::error::Lint failed in $mod"
              cat /tmp/lint.log
              exit 1
            }
          done

  # -----------------------------------------------------------------------
  # Workspace integrity
  # -----------------------------------------------------------------------
  workspace-integrity:
    name: workspace-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify go.work is valid
        working-directory: ${{ github.workspace }}
        run: go work edit -print | tee /tmp/work.txt && test -s /tmp/work.txt

      - name: Build entire workspace
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          for mod in $(grep -oE '\./[^ ]+' go.work); do
            echo "=== Building $mod ==="
            go build ./"$mod"/...
          done
