# ==============================================================================
# PHOENIX CYBER-AI-OS: LinuxKit Assembly Specification
# ==============================================================================

kernel:
  # Use a modern kernel with native WireGuard and advanced eBPF support
  image: linuxkit/kernel:6.6.13
  cmdline: "console=ttyS0 console=tty0 page_poison=1 security=lockdown cgroup_no_v1=all systemd.unified_cgroup_hierarchy=1"

init:
  # The absolute minimum binaries required to boot and run containers
  - linuxkit/init:v1.0.0-rc6
  - linuxkit/runc:v1.0.0-rc6
  - linuxkit/containerd:v1.0.0-rc6

onboot:
  # 1. Mount the BPF virtual filesystem (Required for map pinning and tracking)
  - name: mount-bpf
    image: linuxkit/mount:v1.0.0-rc6
    command: ["/bin/mount", "-t", "bpf", "bpf", "/sys/fs/bpf"]
  
  # 2. Mount cgroups v2 (Required for our cgroup/connect4 eBPF hook)
  - name: mount-cgroup
    image: linuxkit/mount:v1.0.0-rc6
    command: ["/bin/mount", "-t", "cgroup2", "none", "/sys/fs/cgroup"]

  # 3. Bring up the loopback and local networking so XDP has interfaces to attach to
  - name: dhcpcd
    image: linuxkit/dhcpcd:v1.0.0-rc6
    command: ["/sbin/dhcpcd", "--nobackground", "-f", "/dhcpcd.conf", "-1"]

services:
  # ============================================================================
  # THE WARDEN: Cybernetic Control Plane
  # ============================================================================
  - name: phoenix-warden
    # This refers to the container image you built via Docker containing your Go/C code
    image: local/phoenix-warden:latest
    capabilities:
      # Strict Least-Privilege Matrix for the Warden
      - CAP_SYS_ADMIN     # Required to attach BPF programs to cgroups
      - CAP_NET_ADMIN     # Required to configure WireGuard interfaces and attach XDP
      - CAP_BPF           # Required to load maps and BPF bytecode into the kernel
      - CAP_PERFMON       # Required for high-precision bpf_ktime_get_ns() profiling
    binds:
      # Expose the host's raw kernel pathways directly into the Warden's namespace
      - /sys/fs/cgroup:/sys/fs/cgroup
      - /sys/fs/bpf:/sys/fs/bpf
      - /sys/class/net:/sys/class/net
      - /dev:/dev
      - /lib/modules:/lib/modules
    net: host  # Must operate in the root network namespace to control global routing
    pid: host  # Must see all processes to assign cgroup identities
    ipc: host  # Shared memory access
