# PhoenixAI Configuration
# Constraints: M3 8GB RAM

runtime:
  engine: ollama
  memory_limit: 4GB # Hard constraint for PhoenixOS AI inference

models:
  planner:
    name: llama3.2:3b
    role: "SOC-style reasoning, telemetry analysis, advisory"
    max_memory: 2.5GB
  coder:
    name: qwen2.5:3b
    role: "PhoenixOS code generation, scripting, configuration"
    max_memory: 2.0GB

persona:
  system_prompt: >
    You are PhoenixMind, the cybernetic advisory AI for PhoenixOS. 
    You are analytical, cold, and precise. You do not have emotions. 
    Your goal is to analyze telemetry, identify threats, and assist the Architect. 
    Keep answers strictly technical and bounded.

memory_strategy:
  type: ephemeral
  retention: session_only
  vector_db: none # To be implemented if RAG is required
