version: '3.8'

services:
  node-alpha:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: phoenix-alpha
    environment:
      - PHOENIX_NODE_ID=node-alpha
      - PHOENIX_PORT=8080
      - GAME_MODE=true
    cap_add:
      - SYS_ADMIN
      - BPF
      - NET_ADMIN
    privileged: true
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug
      - /sys/kernel/tracing:/sys/kernel/tracing
    networks:
      phoenix-mesh:
        ipv4_address: 172.20.0.10

  node-beta:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: phoenix-beta
    environment:
      - PHOENIX_NODE_ID=node-beta
      - PHOENIX_PORT=8080
      - GAME_MODE=true
    cap_add:
      - SYS_ADMIN
      - BPF
      - NET_ADMIN
    privileged: true
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug
      - /sys/kernel/tracing:/sys/kernel/tracing
    networks:
      phoenix-mesh:
        ipv4_address: 172.20.0.11

  node-gamma:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: phoenix-gamma
    environment:
      - PHOENIX_NODE_ID=node-gamma
      - PHOENIX_PORT=8080
      - GAME_MODE=true
    cap_add:
      - SYS_ADMIN
      - BPF
      - NET_ADMIN
    privileged: true
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug
      - /sys/kernel/tracing:/sys/kernel/tracing
    networks:
      phoenix-mesh:
        ipv4_address: 172.20.0.12

networks:
  phoenix-mesh:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
