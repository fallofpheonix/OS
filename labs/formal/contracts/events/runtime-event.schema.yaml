# PHOENIX MATRIX SOVEREIGN ARCHITECTURE
# [STATUS]: 18-Repository Substrate Consolidated
# [FUTURE ENHANCEMENT]: Needs continuous formal verification scaling and HDF5 vector optimizations.
# [POTENTIAL LOOPHOLE]: Ensure strict hardware isolation when deploying to bare-metal. Watch for timing side-channels.
# [ERROR PRONE AREA]: Concurrency bottlenecks in event bus and race conditions in cross-domain memory mappings.
# Runtime Event Schema
# Canonical operational ontology for the engineering ecosystem
# IMMUTABLE: Events are append-only sources of truth
# DERIVED: runtime-state is computed from event streams
# DATED: 13 May 2026
# PHASE: 2 - Observable Runtime Causality

---
schema_version: "1.0.0"
schema_name: "runtime-event"
schema_type: "event-stream-ontology"
immutability: "append-only"
authority: "canonical source of truth"
enforcement: "machine-validated on emission"

---
# CAUSALITY LAYER
# Purpose: Enable trace reconstruction and incident forensics
# Requirement: Complete causal chain from origin through recovery

causality:
  event_id:
    type: uuid
    required: true
    semantics: "Unique identifier for this individual event"
    constraints:
      - "Must be globally unique within runtime"
      - "Immutable after creation"
      - "Used for deduplication and idempotency"

  trace_id:
    type: uuid
    required: true
    semantics: "Root cause chain identifier; correlates all events from single origin"
    constraints:
      - "Must be preserved across service boundaries"
      - "Must survive degradation and recovery"
      - "Used for root-cause analysis"

  parent_event:
    type: uuid
    required: false
    semantics: "Direct causal predecessor; enables parent-child chain reconstruction"
    constraints:
      - "Must reference existing event in stream"
      - "None for origin events (supervisor startup, scenario init)"
      - "Enables dependency analysis"

---
# RUNTIME CONTEXT LAYER
# Purpose: Identify which ecosystem component emitted the event
# Requirement: Precise origin attribution for mutation tracking

runtime:
  runtime_id:
    type: string
    required: true
    format: "uuid"
    semantics: "Canonical runtime instance identifier"
    constraints:
      - "Assigned at bootstrap"
      - "Immutable for lifetime of runtime"
      - "Used for instance correlation across restarts"

  service:
    type: string
    required: true
    enum:
      - "supervisor"
      - "queue"
      - "sink"
      - "lifecycle"
      - "control-plane"
      - "health-engine"
      - "runtime-lab"
      - "registry"
      - "contracts"
      - "governance"
    semantics: "Which subsystem emitted this event"

  supervisor:
    type: string
    required: true
    semantics: "Which supervisor process owns this event"
    constraints:
      - "Identifies restart lineage"
      - "Used for process-accounting"

  component:
    type: string
    required: true
    semantics: "Logical component within service (e.g., 'queue-worker-3', 'sink-ingress')"
    constraints:
      - "Enables operational scoping"
      - "Supports targeted remediation"

---
# EVENT CLASSIFICATION LAYER
# Purpose: Categorize event semantics for routing and detection
# Requirement: Complete taxonomy of runtime states and transitions

event_classification:
  event_type:
    type: string
    required: true
    enum:
      # Lifecycle events
      - "startup"
      - "shutdown"
      - "restart"
      - "phase-transition"
      
      # Operational events
      - "queue-saturated"
      - "queue-drained"
      - "backpressure-applied"
      - "backpressure-released"
      
      # Failure events
      - "timeout"
      - "degradation"
      - "failure"
      - "quarantine"
      - "recovery"
      - "cascade"
      
      # Integrity events
      - "mutation"
      - "state-divergence"
      - "contract-drift"
      - "authentication-failure"
      - "authorization-failure"
      
      # Supervision events
      - "health-check"
      - "supervisor-takeover"
      - "load-rebalance"
      - "isolation"
      
      # Orchestration events
      - "registry-update"
      - "dependency-resolution"
      - "policy-violation"
      
      # Lab events
      - "scenario-started"
      - "scenario-completed"
      - "scenario-failed"
      - "injection-point-reached"

  severity:
    type: string
    required: true
    enum:
      - "info"           # Normal operational event
      - "warning"        # Degradation beginning, approaching limit
      - "error"          # Service impaired, recovery attempted
      - "critical"       # System unstable, manual intervention possible
      - "catastrophic"   # Uncontrolled cascade, infrastructure risk
    semantics: "Impact amplitude; drives alerting and escalation"

  failure_class:
    type: string
    required: false
    enum:
      - "timeout"
      - "resource-exhaustion"
      - "quota-exceeded"
      - "deadlock"
      - "cascade"
      - "memory-pressure"
      - "cpu-pressure"
      - "disk-pressure"
      - "network-partition"
      - "authentication"
      - "authorization"
      - "corruption"
      - "unknown"
    semantics: "Failure taxonomy for pattern detection and remediation selection"
    constraints:
      - "Required when severity >= 'error'"

---
# LIFECYCLE LAYER
# Purpose: Track runtime phase and state transitions
# Requirement: Distinguish startup, normal operation, degradation, recovery

lifecycle:
  lifecycle_phase:
    type: string
    required: true
    enum:
      - "bootstrap"      # Initial startup, loading configuration
      - "initialization" # Components starting, not yet ready
      - "ready"          # Ready to accept work
      - "degraded"       # Service partially impaired
      - "recovery"       # Attempting to return to ready
      - "shutdown"       # Controlled termination
      - "unknown"        # Phase indeterminate
    semantics: "Current operational phase of runtime"
    constraints:
      - "Drives timeout and backpressure decisions"

  restart_count:
    type: integer
    required: true
    minimum: 0
    semantics: "Number of times this service has restarted"
    constraints:
      - "Must be monotonically increasing"
      - "Used for restart-storm detection"
      - "Preserved across runtime instances via supervisor"

---
# OPERATIONAL STATE LAYER
# Purpose: Quantify resource pressure and degradation progression
# Requirement: Enable predictive degradation detection

operational_state:
  queue_depth:
    type: integer
    required: false
    minimum: 0
    semantics: "Number of pending work items in queue"
    constraints:
      - "Used for saturation detection"
      - "Triggers backpressure"

  latency_ms:
    type: integer
    required: false
    minimum: 0
    semantics: "Processing latency for last completed work item"
    constraints:
      - "Enables SLO violation detection"
      - "Tracks degradation progression"

  memory_pressure:
    type: number
    required: false
    minimum: 0.0
    maximum: 1.0
    semantics: "Memory utilization ratio [0.0 = empty, 1.0 = full]"
    constraints:
      - "Used for memory-pressure class selection"
      - "Enables proactive eviction decisions"

  cpu_pressure:
    type: number
    required: false
    minimum: 0.0
    maximum: 1.0
    semantics: "CPU utilization ratio"
    constraints:
      - "Used for resource-contention detection"

  degraded:
    type: boolean
    required: true
    semantics: "Whether this service is currently in degraded state"
    constraints:
      - "Affects downstream timeout decisions"
      - "Triggers containment policies"

  quarantined:
    type: boolean
    required: true
    semantics: "Whether this service is isolated from cascade propagation"
    constraints:
      - "Prevents failure cascade into healthy components"
      - "Used by health-engine for containment"

---
# TEMPORAL LAYER
# Purpose: Establish wall-clock causality ordering
# Requirement: Correct incident timeline reconstruction

temporal:
  timestamp:
    type: "RFC3339"
    required: true
    semantics: "Wall-clock time of event emission"
    constraints:
      - "Must be UTC"
      - "Must be monotonically increasing within same runtime"
      - "Used for timeline reconstruction"

  occurred_at:
    type: "RFC3339"
    required: false
    semantics: "Actual time event occurred (may differ from emission if delayed)"
    constraints:
      - "For backfilled or delayed events"

---
# METADATA LAYER
# Purpose: Extensibility point for domain-specific context
# Requirement: Support future observability without schema breaking

metadata:
  type: object
  required: false
  semantics: "Arbitrary key-value context for this event"
  constraints:
    - "Schema-less; consumer responsible for validation"
    - "Must not exceed 64KB"
    - "Common keys: request_id, user_id, account_id, scenario_name, injection_point"
    - "Reserved prefix: 'x-' for experimental fields"

---
# PERSISTENCE LAYER
# Purpose: Support event stream durability and replay
# Requirement: Enable recovery and forensics

persistence:
  created_at:
    type: "RFC3339"
    required: true
    semantics: "When event was written to durable storage"

  stored_in:
    type: string
    required: true
    enum:
      - "memory"           # Not yet persisted
      - "runtime-state"    # Written to runtime-state/{service}/events
      - "archive"          # Moved to long-term storage
    semantics: "Current location of authoritative event record"

  sequence_number:
    type: integer
    required: true
    minimum: 0
    semantics: "Monotonically increasing sequence within runtime"
    constraints:
      - "Used for exactly-once delivery"
      - "Enables gap detection"

---
# RUNTIME CONSTRAINTS
# These rules MUST be enforced at emission time

constraints:
  append_only:
    rule: "Events MUST NEVER be mutated after creation"
    enforcement: "Schema validation at emission"
    violation_severity: "catastrophic"

  causal_integrity:
    rule: "trace_id and parent_event MUST be consistent"
    enforcement: "DAG validation on ingestion"
    violation_severity: "critical"

  runtime_continuity:
    rule: "runtime_id MUST be preserved across restarts within same supervisor"
    enforcement: "Supervisor checkpoint validation"
    violation_severity: "critical"

  monotonic_time:
    rule: "timestamp MUST be >= previous event timestamp"
    enforcement: "Stream-level validation"
    violation_severity: "error"

  idempotency:
    rule: "Duplicate event_id MUST produce no new state mutation"
    enforcement: "Deduplication at ingestion"
    violation_severity: "warning"
